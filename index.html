<!DOCTYPE html>
<html lang="ko" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>랜덤 뽑기</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Crect x='18' y='18' width='28' height='28' rx='7' fill='none' stroke='white' stroke-width='4'/%3E%3Ccircle cx='26' cy='26' r='3' fill='white'/%3E%3Ccircle cx='38' cy='38' r='3' fill='white'/%3E%3Ccircle cx='38' cy='26' r='3' fill='white'/%3E%3Ccircle cx='26' cy='38' r='3' fill='white'/%3E%3C/svg%3E">

    <!-- 폰트 -->
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
    
    <!-- 아이콘 & 라이브러리 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <!-- 동적 테마 설정을 위한 CSS 변수 및 스타일 -->
    <style>
        :root {
            --theme-primary: #8b5cf6;
            --theme-primary-hover: #7c3aed;
            --theme-gradient-start: #8b5cf6;
            --theme-gradient-end: #3b82f6;
            --font-main: 'Pretendard', sans-serif;
            --anim-speed: 1; 
        }

        body {
            font-family: var(--font-main);
            transition: background-color 0.3s ease;
        }

        /* 테마 유틸리티 */
        .bg-theme { background-color: var(--theme-primary); }
        .text-theme { color: var(--theme-primary); }
        .border-theme { border-color: var(--theme-primary); }
        .focus-ring-theme:focus { box-shadow: 0 0 0 2px var(--theme-primary); }
        .bg-theme-gradient { background: linear-gradient(135deg, var(--theme-gradient-start), var(--theme-gradient-end)); }
        
        /* 배경 패턴 */
        body.pattern-dots { background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px); background-size: 24px 24px; }
        body.pattern-grid { background-image: linear-gradient(#cbd5e1 1px, transparent 1px), linear-gradient(90deg, #cbd5e1 1px, transparent 1px); background-size: 20px 20px; }
        body.pattern-waves { background: repeating-radial-gradient(circle at 0 0, transparent 0, #f1f5f9 10px, transparent 10px, #e2e8f0 20px); }
        html.dark body.pattern-dots { background-image: radial-gradient(#334155 1.5px, transparent 1.5px); }
        html.dark body.pattern-grid { background-image: linear-gradient(#334155 1px, transparent 1px), linear-gradient(90deg, #334155 1px, transparent 1px); }
        html.dark body.pattern-waves { background: repeating-radial-gradient(circle at 0 0, transparent 0, #0f172a 10px, transparent 10px, #1e293b 20px); }

        html.dark body { background-color: #0f172a; color: #f8fafc; }
        body { background-color: #f8fafc; }

        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        html.dark ::-webkit-scrollbar-thumb { background: #475569; }

        /* 다크모드에서 date input 달력 아이콘을 흰색으로 */
        html.dark input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1) brightness(1.5); }

        /* 애니메이션 */
        .anim-control { animation-duration: calc(1s / var(--anim-speed)) !important; }
        .rolling-control { transition-duration: calc(0.1s / var(--anim-speed)) !important; }

        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOutRight { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
        .toast-enter { animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .toast-exit { animation: fadeOutRight 0.3s ease-in forwards; }

        #confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }
        .sortable-ghost { opacity: 0.4; background-color: #f1f5f9; border: 2px dashed var(--theme-primary); }
        html.dark .sortable-ghost { background-color: #1e293b; }

        /* 모바일 바텀시트 (1024px 미만에서만 적용, 데스크톱 레이아웃은 변경 없음) */
        @media (max-width: 1023px) {
            .app-shell { height: auto !important; min-height: calc(100vh - 6.5rem) !important; }
            body.has-mobile-layout { overflow-y: auto; align-items: stretch; }

            .mobile-sheet { display: none; }
            .mobile-sheet.sheet-open {
                display: flex !important;
                position: fixed;
                left: 0; right: 0; bottom: 0; top: 4vh;
                max-height: 96vh;
                z-index: 90;
                border-radius: 1.5rem 1.5rem 0 0 !important;
                box-shadow: 0 -10px 40px rgba(0,0,0,0.35);
            }
        }
        .mobile-sheet-backdrop {
            display: none;
            position: fixed; inset: 0;
            background: rgba(15, 23, 42, 0.6);
            z-index: 85;
        }
        .mobile-sheet-backdrop.open { display: block; }

        /* 설정 패널은 활동 중(뽑기/팀 나누기)엔 필요 없으므로, 화면 크기와 무관하게 평소엔
           숨겨져 있다가 톱니바퀴 버튼을 눌렀을 때만 오른쪽에서 슬라이드되어 나오는 오버레이
           서랍으로 동작한다(데스크톱도 더 이상 고정 3번째 칼럼이 아니다). */
        .settings-drawer { display: none; }
        .settings-drawer.sheet-open {
            display: flex !important;
            flex-direction: column;
            position: fixed;
            top: 0; right: 0; bottom: 0;
            width: 100%; max-width: 420px;
            z-index: 96;
            border-radius: 0;
            box-shadow: -10px 0 40px rgba(0,0,0,0.35);
        }
        @media (max-width: 1023px) {
            .settings-drawer.sheet-open {
                top: 4vh; left: 0; right: 0; max-width: 100%; max-height: 96vh;
                border-radius: 1.5rem 1.5rem 0 0;
                box-shadow: 0 -10px 40px rgba(0,0,0,0.35);
            }
        }

    </style>
</head>
<body class="has-mobile-layout pattern-dots min-h-screen flex items-center justify-center p-3 lg:p-6 overflow-hidden">

    <!-- PC 최적화 3단 그리드 레이아웃 (모바일에서는 홈 화면 + 바텀시트로 전환) -->
    <div class="app-shell w-full h-[85vh] min-h-[700px] grid grid-cols-1 lg:grid-cols-12 gap-6 relative lg:z-10 pb-20 lg:pb-0">
        <!-- ==========================================
             [2] 중앙 패널: 메인 뽑기 영역 
             ========================================== -->
        <main class="lg:col-span-12 bg-white dark:bg-slate-800 rounded-3xl shadow-2xl flex flex-col border border-slate-200 dark:border-slate-700 overflow-hidden transition-colors relative">

            <!-- Hero Header -->
            <!-- 모바일에서 참가자 목록(참가자 목록 시트)은 기본적으로 숨겨져 있어서, 헤더가
                 flex-1이면 그 빈 공간을 헤더가 다 흡수해버려 아래 이름추가/시작 버튼 줄이
                 화면 밖으로 밀려난다. shrink-0으로 내용 크기만큼만 차지하게 고정한다. -->
            <header class="relative shrink-0 flex flex-col items-center justify-center bg-theme-gradient p-8 lg:py-6 text-center transition-all overflow-hidden">
                <div class="absolute inset-0 opacity-20" style="background-image: radial-gradient(circle at 2px 2px, white 1px, transparent 0); background-size: 20px 20px;"></div>
                <div class="flex items-center justify-center gap-3 relative z-10">
                    <div class="w-20 h-20 lg:w-14 lg:h-14 rounded-2xl flex items-center justify-center shadow-lg ring-1 ring-white/30 transform hover:scale-105 transition-transform shrink-0" style="background: linear-gradient(135deg, #ef4444, #f97316, #eab308, #22c55e, #3b82f6, #8b5cf6, #ec4899);">
                        <i class="fa-solid fa-dice-d20 text-4xl lg:text-2xl text-white drop-shadow-md"></i>
                    </div>
                    <h1 class="text-4xl lg:text-5xl font-bold text-white tracking-wide drop-shadow-sm">랜덤 뽑기</h1>
                </div>
                <p class="text-white/80 mt-4 lg:mt-2 text-sm lg:text-lg relative z-10">긴장되는 순간, 행운의 주인공을 뽑아보세요!</p>
            </header>

            <!-- 참가자 명단 패널 (데스크톱: main 내부에 그대로 표시 / 모바일: 바텀시트) -->
            <div id="participant-sheet" class="mobile-sheet lg:contents bg-white dark:bg-slate-800 flex-col">

                <!-- 모바일 전용 시트 헤더 -->
                <div class="flex lg:hidden justify-between items-center p-5 border-b border-slate-100 dark:border-slate-700 shrink-0">
                    <h2 class="text-lg font-bold text-slate-800 dark:text-white"><i class="fa-solid fa-list-ul mr-2 text-theme"></i>참가자 명단</h2>
                    <button class="mobile-sheet-close text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 w-8 h-8 rounded-full flex items-center justify-center transition-colors" title="닫기">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <!-- Participant List -->
                <div class="flex-1 overflow-y-auto p-4 sm:p-8 pt-4 sm:pt-6 relative bg-slate-50/50 dark:bg-slate-800/50">
                    <ul id="participant-list" class="flex flex-wrap content-start justify-center gap-2 sm:gap-3 pb-4">
                        <!-- 동적 렌더링 -->
                    </ul>
                    <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400">
                        <div class="w-24 h-24 bg-slate-100 dark:bg-slate-700 rounded-full flex items-center justify-center mb-4">
                            <i class="fa-solid fa-user-group text-4xl opacity-50"></i>
                        </div>
                        <p class="font-medium text-lg">참가자가 없습니다.</p>
                        <p class="text-sm mt-1">아래에서 이름을 추가해주세요.</p>
                    </div>
                </div>
            </div>

            <!-- Draw Button -->
            <!-- 모바일에선 참가자 목록이 기본 숨김이라 헤더 아래 남는 공간을 이 영역이
                 flex-1로 채우고, 안의 내용은 justify-center로 세로 가운데에 놓는다.
                 데스크톱(lg)은 원래대로 내용 높이만큼만 차지한다. -->
            <div class="p-8 bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-700 flex-1 lg:flex-none flex flex-col justify-center lg:block">
                <div id="team-settings-panel" class="hidden mb-3 p-3 max-w-2xl mx-auto bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-100 dark:border-slate-700">
                    <div class="flex flex-wrap items-center gap-x-4 gap-y-2">
                        <div class="flex gap-1 shrink-0">
                            <button type="button" data-split="count" class="team-split-toggle-btn px-3 py-1.5 rounded-lg font-bold text-xs transition-colors">팀 개수로</button>
                            <button type="button" data-split="size" class="team-split-toggle-btn px-3 py-1.5 rounded-lg font-bold text-xs transition-colors">팀당 인원으로</button>
                        </div>
                        <input type="number" id="team-number-input" min="2" class="w-20 shrink-0 px-3 py-1.5 text-sm bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus-ring-theme text-slate-700 dark:text-slate-200">
                        <label class="flex items-center gap-2 text-sm font-semibold text-slate-600 dark:text-slate-300 cursor-pointer select-none">
                            <input type="checkbox" id="balance-gender-check" class="w-4 h-4 accent-theme-primary rounded">
                            성별 균형 배분
                        </label>
                        <label class="flex items-center gap-2 text-sm font-semibold text-slate-600 dark:text-slate-300 cursor-pointer select-none">
                            <input type="checkbox" id="balance-ability-check" class="w-4 h-4 accent-theme-primary rounded">
                            신체능력 균형 배분
                        </label>
                    </div>
                </div>
                <!-- 왼쪽 칸(이름 추가)과 오른쪽 칸(총원/대상)을 1fr씩 똑같이 주고, 각 칸
                     안에서 버튼 쪽으로 붙여서(justify-end / justify-start) 시작 버튼을
                     중심으로 좌우가 대칭으로 균형 잡히게 만든다. -->
                <div class="grid grid-cols-1 lg:grid-cols-[1fr_auto_1fr] items-center gap-3">
                    <form id="add-form" class="flex gap-2 w-full lg:w-auto lg:max-w-[280px] lg:justify-self-end">
                        <input type="text" id="name-input" class="flex-1 min-w-0 px-4 py-3 bg-slate-50 dark:bg-slate-800 rounded-xl text-slate-800 dark:text-slate-100 focus:outline-none focus-ring-theme transition-shadow placeholder-slate-400 border border-slate-200 dark:border-slate-700" placeholder="이름 입력" autocomplete="off">
                        <button type="submit" class="w-12 bg-theme text-white rounded-xl flex items-center justify-center transition-transform hover:scale-105 active:scale-95 shadow-md shrink-0" title="참가자 추가">
                            <i class="fa-solid fa-plus text-lg"></i>
                        </button>
                    </form>
                    <div class="w-64 max-w-full rounded-2xl p-[3px] justify-self-center shadow-xl" style="background: linear-gradient(90deg, #ef4444, #f97316, #eab308, #22c55e, #3b82f6, #8b5cf6, #ec4899);">
                        <button id="draw-btn" disabled class="w-full h-12 bg-theme-gradient text-white text-base font-black rounded-xl hover:shadow-2xl hover:shadow-theme/30 transform transition-all hover:-translate-y-1 active:translate-y-0 active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none flex items-center justify-center gap-2 tracking-widest overflow-hidden relative group">
                            <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></div>
                            <i class="fa-solid fa-wand-magic-sparkles text-lg relative z-10"></i>
                            <span class="relative z-10">뽑기 시작!</span>
                        </button>
                    </div>
                    <div class="flex flex-wrap items-center gap-3 justify-center lg:justify-start">
                        <span class="flex items-center bg-slate-100 dark:bg-slate-700 px-4 py-3 rounded-xl font-bold text-slate-600 dark:text-slate-300 shrink-0">
                            총 <span id="count-badge-home" class="text-theme text-lg mx-1">0</span>명
                            <button id="restore-excluded" class="hidden relative ml-2 w-7 h-7 rounded-full bg-theme text-white items-center justify-center hover:scale-110 transition-transform" title="제외된 참가자를 명단으로 복원">
                                <i class="fa-solid fa-clock-rotate-left text-xs"></i>
                                <span id="excluded-count" class="absolute -top-1 -right-1 bg-rose-500 text-white text-[10px] font-bold rounded-full min-w-[16px] h-4 px-1 flex items-center justify-center leading-none"></span>
                            </button>
                        </span>
                        <select id="gender-mode-select" aria-label="뽑기 대상" class="font-semibold bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus-ring-theme text-slate-700 dark:text-slate-200 shrink-0">
                            <option value="all">전체</option>
                            <option value="M">남자만</option>
                            <option value="F">여자만</option>
                            <option value="alternate">번갈아가며</option>
                            <option value="team">팀 나누기</option>
                        </select>
                        <!-- 모바일엔 하단 탭바에 이미 "설정" 탭이 있어 중복이라 숨긴다 -->
                        <button id="desktop-drawer-btn" class="hidden lg:flex w-12 h-12 rounded-xl bg-theme text-white items-center justify-center transition-transform hover:scale-105 active:scale-95 shadow-md shrink-0" title="히스토리 & 통계 / 테마 & 설정">
                            <i class="fa-solid fa-gear text-lg"></i>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

        <!-- ==========================================
             오른쪽 서랍: 히스토리 & 통계 / 테마 & 설정을 탭으로 통합
             (활동 중엔 필요 없어 톱니바퀴 버튼 하나로만 여닫는다)
             ========================================== -->
        <aside id="side-drawer" class="settings-drawer bg-white dark:bg-slate-800 shadow-2xl border-l border-slate-200 dark:border-slate-700 overflow-hidden transition-colors">
            <div class="p-3 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-800/80 shrink-0">
                <div class="flex gap-1">
                    <button type="button" data-drawer-tab="history" class="side-drawer-tab-btn px-3 py-2 rounded-lg font-bold text-sm transition-colors"><i class="fa-solid fa-chart-column mr-1.5"></i>히스토리 & 통계</button>
                    <button type="button" data-drawer-tab="settings" class="side-drawer-tab-btn px-3 py-2 rounded-lg font-bold text-sm transition-colors"><i class="fa-solid fa-palette mr-1.5"></i>테마 & 설정</button>
                </div>
                <button class="mobile-sheet-close text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 w-8 h-8 rounded-full flex items-center justify-center transition-colors shrink-0" title="닫기">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- 히스토리 & 통계 탭 -->
            <div id="drawer-tab-history" class="hidden flex-1 overflow-y-auto overflow-x-hidden flex flex-col p-5">
                <div class="flex justify-end mb-2 shrink-0">
                    <button id="clear-history" class="text-xs text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 px-2 py-1 rounded transition-colors" title="기록 전체 삭제">
                        <i class="fa-solid fa-trash mr-1"></i>전체 삭제
                    </button>
                </div>
                <!-- 날짜 선택 -->
                <div class="mb-4 shrink-0">
                    <h3 class="text-xs font-bold text-slate-400 dark:text-slate-500 mb-3 uppercase tracking-wider">날짜별 확인</h3>
                    <input type="date" id="history-date-filter" class="w-full max-w-full box-border p-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus-ring-theme text-sm text-center text-slate-700 dark:text-slate-200">
                </div>

                <!-- 히스토리 목록 -->
                <div class="flex-1 flex flex-col min-h-0">
                    <h3 class="text-xs font-bold text-slate-400 dark:text-slate-500 mb-3 uppercase tracking-wider">타임라인</h3>
                    <ul id="history-list" class="space-y-3 flex-1 overflow-y-auto pr-2 pb-2">
                        <!-- 동적 렌더링 -->
                    </ul>
                </div>
            </div>

            <!-- 테마 & 설정 탭 -->
            <div id="drawer-tab-settings" class="hidden flex-1 overflow-y-auto p-6 space-y-7 text-sm text-slate-700 dark:text-slate-300">

                <!-- 명단 관리 도구 (활동 중에는 필요 없어 참가자 화면에서 이리로 옮김) -->
                <div class="space-y-3">
                    <label class="block font-bold text-slate-800 dark:text-white">명단 관리</label>
                    <label class="flex items-center gap-2 text-sm font-semibold text-slate-600 dark:text-slate-300 cursor-pointer select-none group">
                        <div class="relative">
                            <input type="checkbox" id="toggle-exclude" class="sr-only peer">
                            <div class="w-10 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer dark:bg-slate-600 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-red-500"></div>
                        </div>
                        <span class="group-hover:text-theme transition-colors">당첨자 1회성 제외 모드</span>
                    </label>
                    <input type="file" id="import-file-input" accept=".csv,.txt" class="hidden">
                    <div class="grid grid-cols-2 gap-2">
                        <button id="import-list" class="flex items-center justify-center gap-1.5 text-xs font-semibold text-slate-500 dark:text-slate-300 bg-slate-100 dark:bg-slate-900 hover:bg-theme hover:text-white dark:hover:bg-theme rounded-lg py-2 transition-colors" title="CSV로 명단 가져오기"><i class="fa-solid fa-file-import"></i>가져오기</button>
