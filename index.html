        }[c]));

        // 이전 버전(문자열 배열 / ability 없는 객체)으로 저장된 명단을 {name, gender, ability} 객체 배열로 변환
        const migrateParticipants = (raw) => {
            if (!Array.isArray(raw)) return [];
            return raw.map(p => {
                const obj = typeof p === 'string' ? { name: p, gender: null } : p;
                return { ability: null, ...obj };
            });
        };

        // 날짜별 기록 필터링을 위한 로컬 날짜 키 (YYYY-MM-DD)
        const toDayKey = (d) => {
            const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        };
        const getRecordDayKey = (record) => {
            if (record.dayKey) return record.dayKey;
            const d = new Date(record.date);
            return isNaN(d) ? null : toDayKey(d);
        };

        // 이름 길이에 따라 모바일 화면을 최대한 채우는 폰트 크기 선택
        const getMobileNameSizeClass = (name) => {
            const len = name.length;
            if (len <= 2) return 'text-9xl';
            if (len === 3) return 'text-8xl';
            if (len === 4) return 'text-7xl';
            if (len <= 6) return 'text-6xl';
            return 'text-5xl';
        };

        // DEFAULT_SETTINGS.teamSettings는 중첩 객체이므로 얕은 스프레드로는 참조가 공유된다.
        // 항상 teamSettings를 별도로 복제해 state.settings가 DEFAULT_SETTINGS와 객체를 공유하지 않도록 한다.
        const cloneDefaultSettings = () => ({ ...DEFAULT_SETTINGS, teamSettings: { ...DEFAULT_SETTINGS.teamSettings } });

        // 로컬 스토리지 값 하나가 깨져도(수동 편집, 확장 프로그램 간섭 등) 앱 전체가 빈 화면으로
        // 멎지 않도록, 파싱 실패 시 기본값으로 폴백하고 손상된 키는 지워서 다음 로드부터 정상화한다.
        let hadCorruptedStorage = false;
        const safeParseStorage = (key, fallback) => {
            const raw = localStorage.getItem(key);
            if (raw === null) return fallback;
            try {
                return JSON.parse(raw);
            } catch (e) {
                console.warn(`손상된 localStorage 항목(${key})을 초기화합니다.`, e);
                localStorage.removeItem(key);
                hadCorruptedStorage = true;
                return fallback;
            }
        };

        // 로컬 스토리지 데이터 로드
        const savedSettings = safeParseStorage('pd_settings', {}) || {};
        let state = {
            participants: migrateParticipants(safeParseStorage('pd_participants', [])),
            excluded: migrateParticipants(safeParseStorage('pd_excluded', [])),
            history: safeParseStorage('pd_history', []) || [],
            settings: {
                ...cloneDefaultSettings(),
                ...savedSettings,
                teamSettings: { ...DEFAULT_SETTINGS.teamSettings, ...(savedSettings.teamSettings || {}) }
            }
        };

        const saveState = (key) => {
            if(key === 'participants') localStorage.setItem('pd_participants', JSON.stringify(state.participants));
            if(key === 'excluded') localStorage.setItem('pd_excluded', JSON.stringify(state.excluded));
            if(key === 'history') localStorage.setItem('pd_history', JSON.stringify(state.history));
            if(key === 'settings') localStorage.setItem('pd_settings', JSON.stringify(state.settings));
        };

        // classlog에서 열었을 때만 해당 교사의 최신 학생 명단으로 교체한다.
        // 직접 접속한 사용자와 다른 선생님의 기존 입력/CSV 방식은 그대로 유지한다.
        const CLASSLOG_ORIGINS = new Set([
            'https://classlog-ten.vercel.app',
            'http://localhost:5173',
            'http://127.0.0.1:5173'
        ]);

        const syncRosterFromClasslog = (event) => {
            if (
                !CLASSLOG_ORIGINS.has(event.origin) ||
                event.source !== window.opener ||
                event.data?.type !== 'classlog-roster-sync' ||
                event.data?.version !== 1 ||
                event.data?.mode !== 'replace' ||
                !Array.isArray(event.data?.participants)
            ) return;

            // 기존 참가자와 이름이 같으면 그 사람이 지정해둔 능력(상/중/하) 등급을 유지한다.
            // (이름을 키로 매칭하므로, classlog가 보내는 이름 표기가 어제와 달라지면 매칭이
            // 끊겨 등급이 없어진 것처럼 보일 수 있다 — 그래서 실제로 몇 명이 유지 안 됐는지
            // 아래에서 세어 눈에 띄게 경고한다.)
            const oldAbilityByName = new Map(
                [...state.participants, ...state.excluded]
                    .filter((p) => p.ability)
                    .map((p) => [p.name.trim(), p.ability])
            );
            const seen = new Set();
            state.participants = event.data.participants
                .filter((participant) => participant && typeof participant.name === 'string')
                .map((participant) => ({
                    name: participant.name.trim(),
                    gender: participant.gender === 'M' || participant.gender === 'F' ? participant.gender : null,
                    ability: oldAbilityByName.get(participant.name.trim()) || null
                }))
                .filter((participant) => participant.name && !seen.has(participant.name) && seen.add(participant.name));
            state.excluded = [];
            saveState('participants');
            saveState('excluded');
            renderParticipants();

            const carriedOverCount = state.participants.filter((p) => p.ability).length;
            const droppedCount = oldAbilityByName.size - carriedOverCount;
            showToast(`classlog 학생 명단 ${state.participants.length}명을 불러왔습니다.`, 'success');
            if (droppedCount > 0) {
                setTimeout(() => showToast(
                    `이전에 지정한 능력 등급 중 ${droppedCount}명분이 이름 불일치로 유지되지 않았습니다. 등급 관리에서 확인해주세요.`,
                    'error'
                ), 1200);
            }
        };

        window.addEventListener('message', syncRosterFromClasslog);
        const openerOrigin = document.referrer ? new URL(document.referrer).origin : '';
        if (window.opener && CLASSLOG_ORIGINS.has(openerOrigin)) {
            window.opener.postMessage({ type: 'randomdraw-ready', version: 1 }, openerOrigin);
        }

        // --- 3. 오디오 시스템 ---
        let audioCtx;
        const initAudio = () => {
            if (!state.settings.soundOn) return;
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        };

        const playSound = (type) => {
            if (!state.settings.soundOn || !audioCtx) return;
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, t); osc.frequency.exponentialRampToValueAtTime(300, t + 0.1);
                gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
                osc.start(t); osc.stop(t + 0.1);
            } else if (type === 'tick') {
                osc.type = 'square'; osc.frequency.setValueAtTime(200 + Math.random()*150, t);
                gain.gain.setValueAtTime(0.05, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.05);
                osc.start(t); osc.stop(t + 0.05);
            } else if (type === 'success') {
                const freqs = [523.25, 659.25, 783.99, 1046.50];
                freqs.forEach((freq, i) => {
                    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                    o.type = 'triangle'; o.frequency.setValueAtTime(freq, t + i * 0.1);
                    g.gain.setValueAtTime(0, t + i * 0.1); g.gain.linearRampToValueAtTime(0.3, t + i * 0.1 + 0.05); g.gain.exponentialRampToValueAtTime(0.01, t + i * 0.1 + 2);
                    o.connect(g); g.connect(audioCtx.destination); o.start(t + i * 0.1); o.stop(t + i * 0.1 + 2);
                });
            }
        };

        // --- 4. 공통 UI 유틸리티 ---
        const showToast = (message, type = 'info', { actionLabel, onAction } = {}) => {
            const toast = document.createElement('div');
            let colors = type === 'success' ? 'bg-emerald-500 text-white shadow-emerald-500/30'
                       : type === 'error' ? 'bg-rose-500 text-white shadow-rose-500/30'
                       : 'bg-slate-800 text-white dark:bg-white dark:text-slate-800 shadow-slate-800/30';
            let icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-circle-exclamation' : 'fa-info-circle';

            toast.className = `toast-enter pointer-events-auto flex items-center gap-3 px-6 py-4 rounded-2xl shadow-xl font-bold text-sm ${colors}`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i> <span></span>`;
            // message는 참가자 이름 등 사용자 입력을 담을 수 있어 HTML로 해석되지 않도록
            // innerHTML이 아닌 textContent로 채운다(XSS 방지).
            toast.querySelector('span').textContent = message;

            let dismissTimer;
            const dismiss = () => {
                clearTimeout(dismissTimer);
                toast.classList.replace('toast-enter', 'toast-exit');
                setTimeout(() => toast.remove(), 300);
            };

            if (actionLabel && onAction) {
                const actionBtn = document.createElement('button');
                actionBtn.type = 'button';
                actionBtn.className = 'ml-2 underline decoration-2 underline-offset-2 hover:opacity-80 transition-opacity shrink-0';
                actionBtn.textContent = actionLabel;
                actionBtn.addEventListener('click', () => {
                    onAction();
                    dismiss();
                });
                toast.appendChild(actionBtn);
            }

            dom.toastContainer.appendChild(toast);
            dismissTimer = setTimeout(dismiss, 3000);
        };

        // --- 4-1. 공용 확인 모달 (네이티브 confirm() 대체) ---
        let confirmModalCallback = null;
        const showConfirm = (title, desc, onConfirm) => {
            dom.confirmModalTitle.textContent = title;
            dom.confirmModalDesc.textContent = desc;
            confirmModalCallback = onConfirm;
            dom.confirmModal.classList.remove('hidden');
        };
        dom.confirmModalOkBtn.addEventListener('click', () => {
            dom.confirmModal.classList.add('hidden');
            const cb = confirmModalCallback;
            confirmModalCallback = null;
            if (cb) cb();
        });
        dom.confirmModalCancelBtn.addEventListener('click', () => {
            dom.confirmModal.classList.add('hidden');
            confirmModalCallback = null;
        });

        // --- 5. 테마/설정 로직 ---
        const applySettingsToDOM = () => {
            const s = state.settings;
            dom.html.style.setProperty('--theme-primary', s.primaryColor);
            dom.html.style.setProperty('--theme-gradient-start', s.primaryColor);
            
            // 색상을 약간 밝게 변형하여 그라디언트 생성
            const c = s.primaryColor;
            dom.html.style.setProperty('--theme-gradient-end', c);

            if (s.darkMode) dom.html.classList.add('dark');
            else dom.html.classList.remove('dark');

            dom.html.style.setProperty('--font-main', s.font);

            dom.body.classList.remove('pattern-dots', 'pattern-grid', 'pattern-waves', 'none');
            if(s.pattern !== 'none') dom.body.classList.add(s.pattern);

            dom.html.style.setProperty('--anim-speed', s.animSpeed);

            // 폼 동기화
            dom.colorPicker.value = s.primaryColor;
            dom.themeToggle.checked = s.darkMode;
            dom.patternSelect.value = s.pattern;
            dom.fontSelect.value = s.font;
            dom.speedSlider.value = s.animSpeed;
            dom.speedVal.textContent = s.animSpeed + 'x';
            dom.soundToggle.checked = s.soundOn;
            dom.toggleExclude.checked = s.excludeMode;
            dom.genderModeSelect.value = s.genderMode;

            // 팀 나누기 UI 동기화
            const teamModeActive = s.genderMode === 'team';
            dom.teamSettingsPanel.classList.toggle('hidden', !teamModeActive);
            dom.drawBtn.querySelector('span').textContent = teamModeActive ? '팀 나누기 시작!' : '운명의 뽑기 시작!';
            dom.toggleExclude.disabled = teamModeActive;
            dom.teamSplitToggleBtns.forEach(b => {
                const active = b.dataset.split === s.teamSettings.splitBy;
                b.classList.toggle('bg-theme', active);
                b.classList.toggle('text-white', active);
                b.classList.toggle('bg-white', !active);
                b.classList.toggle('dark:bg-slate-800', !active);
                b.classList.toggle('text-slate-400', !active);
                b.classList.toggle('dark:text-slate-500', !active);
            });
            dom.teamNumberInput.value = s.teamSettings.splitBy === 'size' ? s.teamSettings.teamSize : s.teamSettings.teamCount;
            dom.balanceGenderCheck.checked = s.teamSettings.balanceGender;
            dom.balanceAbilityCheck.checked = s.teamSettings.balanceAbility;
        };

        const updateSetting = (key, value) => {
            state.settings[key] = value;
            saveState('settings');
            applySettingsToDOM();
        };

        // 설정 이벤트 바인딩
        dom.colorPicker.addEventListener('input', (e) => updateSetting('primaryColor', e.target.value));
        dom.colorPresets.forEach(btn => {
            btn.addEventListener('click', (e) => updateSetting('primaryColor', e.target.dataset.color));
        });
        dom.themeToggle.addEventListener('change', (e) => updateSetting('darkMode', e.target.checked));
        dom.patternSelect.addEventListener('change', (e) => updateSetting('pattern', e.target.value));
        dom.fontSelect.addEventListener('change', (e) => updateSetting('font', e.target.value));
        dom.speedSlider.addEventListener('input', (e) => updateSetting('animSpeed', parseFloat(e.target.value)));
        dom.soundToggle.addEventListener('change', (e) => updateSetting('soundOn', e.target.checked));
        dom.toggleExclude.addEventListener('change', (e) => updateSetting('excludeMode', e.target.checked));
        dom.genderModeSelect.addEventListener('change', (e) => updateSetting('genderMode', e.target.value));

        const updateTeamSetting = (key, value) => {
            state.settings.teamSettings[key] = value;
            saveState('settings');
            applySettingsToDOM();
        };

        dom.teamSplitToggleBtns.forEach(btn => {
            btn.addEventListener('click', () => updateTeamSetting('splitBy', btn.dataset.split));
        });

        dom.teamNumberInput.addEventListener('change', (e) => {
            const key = state.settings.teamSettings.splitBy === 'size' ? 'teamSize' : 'teamCount';
            const clamped = TeamDrawLogic.clampTeamCount(e.target.value, state.participants.length);
            updateTeamSetting(key, clamped);
        });

        dom.balanceGenderCheck.addEventListener('change', (e) => updateTeamSetting('balanceGender', e.target.checked));
        dom.balanceAbilityCheck.addEventListener('change', (e) => updateTeamSetting('balanceAbility', e.target.checked));

        dom.resetSettings.addEventListener('click', () => {
            showConfirm('기본 설정으로 복구', '설정을 기본값으로 되돌리시겠습니까?', () => {
                state.settings = cloneDefaultSettings();
                saveState('settings');
                applySettingsToDOM();
                showToast('기본 설정으로 복구되었습니다.');
            });
        });

        // --- 5-1. 모바일 바텀시트 내비게이션 ---
        const mobileSheetBackdrop = document.getElementById('mobile-sheet-backdrop');
        const mobileSheetIds = ['participant-sheet', 'side-drawer'];
        const mobileTabBtns = document.querySelectorAll('.mobile-tab-btn');

        const setActiveTab = (openId) => {
            mobileTabBtns.forEach(btn => {
                const active = btn.dataset.target === openId;
                btn.classList.toggle('text-theme', active);
                btn.classList.toggle('text-slate-600', !active);
                btn.classList.toggle('dark:text-slate-300', !active);
            });
        };

        const closeMobileSheets = () => {
            mobileSheetIds.forEach(id => document.getElementById(id).classList.remove('sheet-open'));
            mobileSheetBackdrop.classList.remove('open');
            setActiveTab(null);
        };

        const openMobileSheet = (id) => {
            mobileSheetIds.forEach(sid => document.getElementById(sid).classList.toggle('sheet-open', sid === id));
            mobileSheetBackdrop.classList.add('open');
            setActiveTab(id);
        };

        mobileTabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const id = btn.dataset.target;
                if (btn.dataset.drawerTab) switchDrawerTab(btn.dataset.drawerTab);
                if (document.getElementById(id).classList.contains('sheet-open')) closeMobileSheets();
                else openMobileSheet(id);
            });
        });

        document.querySelectorAll('.mobile-sheet-close').forEach(btn => {
            btn.addEventListener('click', closeMobileSheets);
        });

        mobileSheetBackdrop.addEventListener('click', closeMobileSheets);

        // 히스토리 & 통계 / 테마 & 설정을 한 서랍 안에 탭으로 합쳤다 — 둘 다 활동 중엔
        // 상시 노출이 필요 없어서, 톱니바퀴 버튼 하나로만 여닫는 오버레이 서랍으로 뺐다.
        const drawerTabBtns = document.querySelectorAll('.side-drawer-tab-btn');
        const switchDrawerTab = (tab) => {
            document.getElementById('drawer-tab-history').classList.toggle('hidden', tab !== 'history');
            document.getElementById('drawer-tab-settings').classList.toggle('hidden', tab !== 'settings');
            drawerTabBtns.forEach(btn => {
                const active = btn.dataset.drawerTab === tab;
                btn.classList.toggle('bg-theme', active);
                btn.classList.toggle('text-white', active);
                btn.classList.toggle('text-slate-500', !active);
                btn.classList.toggle('dark:text-slate-400', !active);
            });
        };
        drawerTabBtns.forEach(btn => {
            btn.addEventListener('click', () => switchDrawerTab(btn.dataset.drawerTab));
        });
        switchDrawerTab('settings'); // 기본으로 보여줄 탭(톱니바퀴 아이콘과 맞춤)

        document.getElementById('desktop-drawer-btn').addEventListener('click', () => {
            if (document.getElementById('side-drawer').classList.contains('sheet-open')) closeMobileSheets();
            else openMobileSheet('side-drawer');
        });

        // --- 6. 메인 앱 로직 (참가자 관리) ---
        let sortableInstance = null;

        const updateRestoreButton = () => {
            // 1회성 제외 모드로 빠진 사람이 있을 때만 "총 N명" 배지 안에 작은 복원
            // 아이콘을 보여준다 — 평소(제외된 사람 없음)엔 자리를 차지하지 않는다.
            const hasExcluded = state.excluded.length > 0;
            dom.restoreExcludedBtn.classList.toggle('hidden', !hasExcluded);
            dom.restoreExcludedBtn.classList.toggle('flex', hasExcluded);
            dom.excludedCount.textContent = hasExcluded ? state.excluded.length : '';
        };

        const renderParticipants = () => {
            dom.list.innerHTML = '';
            dom.countBadge.textContent = state.participants.length;
            dom.countBadgeHome.textContent = state.participants.length;
            updateRestoreButton();

            if (state.participants.length === 0) {
                dom.emptyState.style.display = 'flex';
                dom.drawBtn.disabled = true;
            } else {
                dom.emptyState.style.display = 'none';
                dom.drawBtn.disabled = false;
            }

            state.participants.forEach((p, idx) => {
                const li = document.createElement('li');
                // TV/프로젝터 화면에서 학생들도 자기 이름을 알아볼 수 있도록 이름 글씨와
                // 카드 자체를 크게 키운다(1920x1080에서 약 30명이 화면을 채우는 정도를
                // 기준으로 잡았다). 번호는 순서일 뿐 학생에게 의미가 없어 카드에서 뺐고,
                // 성별도 학생 화면에 노출할 정보가 아니라 표시하지 않는다(등급 · 성별
                // 관리에서만 확인/수정).
                // 이름을 카드 가운데 정렬하기 위해 grid(드래그 아이콘 / 이름(1fr, 가운데 정렬) /
                // 삭제 버튼) 3열로 구성한다 — flex justify-between이면 이름이 항상 왼쪽에
                // 붙어버려서 가운데로 오지 않는다.
                // 모바일에서는 카드 폭을 "50% - 간격 절반"으로 줘서 한 줄에 정확히 2명씩
                // 보이게 하고, 화면이 커지면(sm 이상) 글자 크기에 맞춰 큰 고정폭으로 바꾼다.
                li.className = 'grid grid-cols-[auto_1fr_auto] items-center gap-2 sm:gap-4 min-w-[calc(50%-4px)] sm:min-w-[280px] bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-3 sm:p-5 rounded-xl shadow-sm hover:shadow-md hover:border-theme transition-shadow group cursor-move';
                li.title = '클릭하여 정보 수정';
                li.dataset.id = p.name;
                li.innerHTML = `
                    <i class="fa-solid fa-grip-vertical text-slate-300 dark:text-slate-600 group-hover:text-theme transition-colors"></i>
                    <span class="font-bold text-lg sm:text-3xl xl:text-4xl text-slate-700 dark:text-slate-200 truncate text-center">${escapeHtml(p.name)}</span>
                    <button type="button" class="remove-participant-btn text-slate-300 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-500/10 w-9 h-9 sm:w-10 sm:h-10 rounded-full flex items-center justify-center transition-colors shrink-0" title="삭제">
                        <i class="fa-solid fa-lg fa-xmark"></i>
                    </button>
                `;
                li.querySelector('.remove-participant-btn').addEventListener('click', (e) => {
                    e.stopPropagation(); // 카드 클릭(정보 수정 모달 열기)으로 이어지지 않도록
                    removeParticipant(p.name);
                });
                li.addEventListener('click', () => openEditParticipantModal(idx));
                dom.list.appendChild(li);
            });

            // Drag & Drop 초기화
            if(sortableInstance) sortableInstance.destroy();
            sortableInstance = new Sortable(dom.list, {
                animation: 150,
                ghostClass: 'sortable-ghost',
                onEnd: (evt) => {
                    const movedItem = state.participants.splice(evt.oldIndex, 1)[0];
                    state.participants.splice(evt.newIndex, 0, movedItem);
                    saveState('participants');
                    renderParticipants();
                }
            });
        };

        // 메인 화면에서 참가자 카드를 클릭하면 이름/성별/등급을 한 번에 고칠 수 있는
        // 간단한 모달을 연다(등급 · 성별 관리 모달까지 안 가도 되도록).
        let editingParticipantIndex = null;

        const openEditParticipantModal = (idx) => {
            const p = state.participants[idx];
            if (!p) return;
            editingParticipantIndex = idx;
            dom.editParticipantName.value = p.name;
            dom.editParticipantGender.value = p.gender || '';
            dom.editParticipantAbility.value = p.ability || '';
            dom.editParticipantModal.classList.remove('hidden');
            dom.editParticipantName.focus();
        };

        const closeEditParticipantModal = () => {
            dom.editParticipantModal.classList.add('hidden');
            editingParticipantIndex = null;
        };

        dom.editParticipantCloseBtn.addEventListener('click', closeEditParticipantModal);

        dom.editParticipantForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const p = state.participants[editingParticipantIndex];
            if (!p) { closeEditParticipantModal(); return; }
            const newName = dom.editParticipantName.value.trim();
            if (!newName) {
                showToast('이름을 입력해주세요.', 'error');
                return;
            }
            if (state.participants.some(other => other !== p && other.name === newName)) {
                showToast('이미 명단에 있는 이름입니다.', 'error');
                return;
            }
            p.name = newName;
            p.gender = dom.editParticipantGender.value || null;
            p.ability = dom.editParticipantAbility.value || null;
            saveState('participants');
            renderParticipants();
            closeEditParticipantModal();
            showToast('참가자 정보를 수정했습니다.', 'success');
        });

        // 메인 화면에서는 이름만 빠르게 입력하고, 성별/등급은 이 모달(설정 서랍의
        // "등급 · 성별 관리" 버튼으로 연다)에서 나중에 지정한다(새로 추가된 참가자는
        // 둘 다 미지정 상태로 시작).

        const renderAbilityModal = () => {
            if (state.participants.length === 0) {
                dom.abilityModalList.innerHTML = `<li class="text-center text-slate-400 py-10 text-sm">참가자가 없습니다.</li>`;
                return;
            }
            // 행은 이름이 아니라 "현재 렌더링 시점의 배열 인덱스"로 식별한다 — 이름 자체를
            // 이 모달에서 고칠 수 있으므로, 이름을 키로 쓰면 수정 직후 다른 컨트롤들이 옛
            // 이름을 참조하게 되어 엉뚱한 사람이 바뀌는 문제가 생긴다.
            dom.abilityModalList.innerHTML = state.participants.map((p, idx) => `
                    <li class="flex items-center justify-between gap-2 bg-slate-50 dark:bg-slate-900 p-3 rounded-xl">
                        <input type="text" data-index="${idx}" class="name-edit-input text-sm font-bold bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1 focus:outline-none focus-ring-theme text-slate-700 dark:text-slate-200 min-w-0 flex-1" value="${escapeHtml(p.name)}" title="이름 수정">
                        <div class="flex items-center gap-2 shrink-0">
                            <select data-index="${idx}" class="gender-select text-sm font-semibold bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1 focus:outline-none focus-ring-theme text-slate-700 dark:text-slate-200">
                                <option value="" ${!p.gender ? 'selected' : ''}>미지정</option>
                                <option value="M" ${p.gender === 'M' ? 'selected' : ''}>남</option>
                                <option value="F" ${p.gender === 'F' ? 'selected' : ''}>여</option>
                            </select>
                            <select data-index="${idx}" class="ability-select text-sm font-semibold bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1 focus:outline-none focus-ring-theme text-slate-700 dark:text-slate-200">
                                <option value="" ${!p.ability ? 'selected' : ''}>미지정</option>
                                <option value="상" ${p.ability === '상' ? 'selected' : ''}>상</option>
                                <option value="중" ${p.ability === '중' ? 'selected' : ''}>중</option>
                                <option value="하" ${p.ability === '하' ? 'selected' : ''}>하</option>
                            </select>
                        </div>
                    </li>
                `).join('');

            dom.abilityModalList.querySelectorAll('.name-edit-input').forEach(input => {
                const commitRename = () => {
                    const p = state.participants[Number(input.dataset.index)];
                    if (!p) return;
                    const newName = input.value.trim();
                    if (!newName || newName === p.name) { input.value = p.name; return; }
                    if (state.participants.some(other => other !== p && other.name === newName)) {
                        showToast('이미 명단에 있는 이름입니다.', 'error');
                        input.value = p.name;
                        return;
                    }
                    p.name = newName;
                    saveState('participants');
                    renderParticipants();
                    renderAbilityModal();
                    showToast('이름을 수정했습니다.', 'success');
                };
                input.addEventListener('blur', commitRename);
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
                });
            });

            dom.abilityModalList.querySelectorAll('.gender-select').forEach(sel => {
                sel.addEventListener('change', (e) => {
                    const p = state.participants[Number(e.target.dataset.index)];
                    if (p) {
                        p.gender = e.target.value || null;
                        saveState('participants');
                        renderParticipants();
                    }
                });
            });

            dom.abilityModalList.querySelectorAll('.ability-select').forEach(sel => {
                sel.addEventListener('change', (e) => {
                    const p = state.participants[Number(e.target.dataset.index)];
                    if (p) {
                        p.ability = e.target.value || null;
                        saveState('participants');
                    }
                });
            });
        };

        dom.abilityModalBtn.addEventListener('click', () => {
            renderAbilityModal();
            dom.abilityModal.classList.remove('hidden');
        });
        dom.abilityModalCloseBtn.addEventListener('click', () => dom.abilityModal.classList.add('hidden'));

        dom.form.addEventListener('submit', (e) => {
            e.preventDefault();
            initAudio();
            const name = dom.input.value.trim();
            if (!name) return;
            if (state.participants.some(p => p.name === name)) {
                showToast('이미 명단에 있는 이름입니다.', 'error');
                return;
            }
            state.participants.push({ name, gender: null, ability: null });
            saveState('participants');
            dom.input.value = '';
            renderParticipants();
            playSound('click');
        });

        window.removeParticipant = (name) => {
            initAudio();
            const removedIdx = state.participants.findIndex(p => p.name === name);
            if (removedIdx === -1) return;
            const [removed] = state.participants.splice(removedIdx, 1);
            saveState('participants');
            renderParticipants();
            playSound('click');
            showToast(`'${removed.name}' 님을 삭제했습니다.`, 'info', {
                actionLabel: '실행취소',
                onAction: () => {
                    if (state.participants.some(p => p.name === removed.name)) return;
                    state.participants.splice(Math.min(removedIdx, state.participants.length), 0, removed);
                    saveState('participants');
                    renderParticipants();
                    showToast(`'${removed.name}' 님을 복구했습니다.`, 'success');
                }
            });
        };

        dom.resetListBtn.addEventListener('click', () => {
            showConfirm('명단 초기화', '현재 명단을 모두 삭제하시겠습니까?', () => {
                const backupParticipants = state.participants;
                const backupExcluded = state.excluded;
                state.participants = [];
                state.excluded = [];
                saveState('participants');
                saveState('excluded');
                renderParticipants();
                showToast(`명단 ${backupParticipants.length}명을 초기화했습니다.`, 'info', {
                    actionLabel: '실행취소',
                    onAction: () => {
                        state.participants = backupParticipants;
                        state.excluded = backupExcluded;
                        saveState('participants');
                        saveState('excluded');
                        renderParticipants();
                        showToast('초기화를 취소하고 명단을 복구했습니다.', 'success');
                    }
                });
            });
        });

        dom.restoreExcludedBtn.addEventListener('click', () => {
            if (state.excluded.length === 0) return;
            const restoredCount = state.excluded.length;
            const existingNames = new Set(state.participants.map(p => p.name));
            state.excluded.forEach(p => {
                if (!existingNames.has(p.name)) {
                    const { excludedByRecordId, ...restored } = p;
                    state.participants.push(restored);
                    existingNames.add(p.name);
                }
            });
            state.excluded = [];
            saveState('participants');
            saveState('excluded');
            renderParticipants();
            showToast(`${restoredCount}명을 명단으로 복원했습니다.`, 'success');
        });

        // --- 6-1. 명단 CSV 가져오기 / 내보내기 ---
        const parseCSV = (text) => {
            // BOM 제거
            text = text.replace(/^﻿/, '');
            const rows = [];
            let row = [], field = '', inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (inQuotes) {
                    if (c === '"') {
                        if (text[i + 1] === '"') { field += '"'; i++; }
                        else inQuotes = false;
                    } else field += c;
                } else {
                    if (c === '"') inQuotes = true;
                    else if (c === ',') { row.push(field); field = ''; }
                    else if (c === '\n' || c === '\r') {
                        if (c === '\r' && text[i + 1] === '\n') i++;
                        row.push(field); field = '';
                        rows.push(row); row = [];
                    } else field += c;
                }
            }
            if (field !== '' || row.length > 0) { row.push(field); rows.push(row); }
            return rows.filter(r => r.some(f => f.trim() !== ''));
        };

        const GENDER_MAP = { '남': 'M', '남자': 'M', 'm': 'M', 'male': 'M', '여': 'F', '여자': 'F', 'f': 'F', 'female': 'F' };

        const extractParticipantsFromCSV = (text) => {
            const rows = parseCSV(text);
            if (rows.length === 0) return [];

            const header = rows[0].map(h => h.trim());
            const nameColIdx = header.findIndex(h => h === '성명' || h === '이름' || h.toLowerCase() === 'name');
            const genderColIdx = header.findIndex(h => h === '성별' || h.toLowerCase() === 'gender');
            const abilityColIdx = header.findIndex(h => h === '등급' || h === '신체능력' || h.toLowerCase() === 'ability');

            let dataRows, colIdx;
            if (nameColIdx !== -1) {
                dataRows = rows.slice(1);
                colIdx = nameColIdx;
            } else if (header.length === 1) {
                // 헤더 없이 한 줄에 이름 하나씩 있는 단순 목록으로 간주
                dataRows = rows;
                colIdx = 0;
            } else {
                return null; // 이름 컬럼을 찾을 수 없음
            }

            const seen = new Set();
            const participants = [];
            dataRows.forEach(r => {
                const name = (r[colIdx] || '').trim();
                if (!name || seen.has(name)) return;
                seen.add(name);
                const genderRaw = genderColIdx !== -1 ? (r[genderColIdx] || '').trim().toLowerCase() : '';
                const abilityRaw = abilityColIdx !== -1 ? (r[abilityColIdx] || '') : '';
                participants.push({ name, gender: GENDER_MAP[genderRaw] || null, ability: TeamDrawLogic.mapAbilityValue(abilityRaw) });
            });
            return participants;
        };

        let pendingImportParticipants = null;

        const finishImport = (participants, mode) => {
            let addedCount = 0;
            if (mode === 'replace') {
                state.participants = [...participants];
                state.excluded = [];
                saveState('excluded');
                addedCount = participants.length;
            } else {
                const existingNames = new Set(state.participants.map(p => p.name));
                participants.forEach(p => {
                    if (!existingNames.has(p.name)) {
                        state.participants.push(p);
                        existingNames.add(p.name);
                        addedCount++;
                    }
                });
            }
            saveState('participants');
            renderParticipants();
            showToast(mode === 'replace' ? `명단을 ${addedCount}명으로 교체했습니다.` : `${addedCount}명을 추가했습니다.`, 'success');
        };

        dom.importListBtn.addEventListener('click', () => dom.importFileInput.click());

        dom.importFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const participants = extractParticipantsFromCSV(ev.target.result);
                if (participants === null) {
                    showToast("'성명' 또는 '이름' 컬럼을 찾을 수 없습니다.", 'error');
                } else if (participants.length === 0) {
                    showToast('가져올 이름이 없습니다.', 'error');
                } else if (state.participants.length === 0) {
                    finishImport(participants, 'replace');
                } else {
                    pendingImportParticipants = participants;
                    dom.importModalDesc.textContent = `${participants.length}명의 이름을 찾았습니다. 기존 명단(${state.participants.length}명)을 어떻게 처리할까요?`;
                    dom.importModal.classList.remove('hidden');
                }
            };
            reader.readAsText(file, 'UTF-8');
            dom.importFileInput.value = '';
        });

        const closeImportModal = () => {
            dom.importModal.classList.add('hidden');
            pendingImportParticipants = null;
        };

        dom.importReplaceBtn.addEventListener('click', () => {
            if (pendingImportParticipants) finishImport(pendingImportParticipants, 'replace');
            closeImportModal();
        });
        dom.importMergeBtn.addEventListener('click', () => {
            if (pendingImportParticipants) finishImport(pendingImportParticipants, 'merge');
            closeImportModal();
        });
        dom.importCancelBtn.addEventListener('click', closeImportModal);

        const csvField = (value) => /[",\n]/.test(value) ? `"${value.replace(/"/g, '""')}"` : value;

        dom.exportListBtn.addEventListener('click', () => {
            if (state.participants.length === 0) {
                showToast('내보낼 명단이 없습니다.', 'error');
                return;
            }
            const genderLabel = { M: '남', F: '여' };
            const lines = ['성명,성별,등급', ...state.participants.map(p => `${csvField(p.name)},${genderLabel[p.gender] || ''},${p.ability || ''}`)];
            const csvContent = '﻿' + lines.join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const today = new Date().toISOString().slice(0, 10).replace(/-/g, '');
            const a = document.createElement('a');
            a.href = url;
            a.download = `참가자명단_${today}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('명단을 내보냈습니다.', 'success');
        });

        // --- 7. 뽑기 로직 (애니메이션 포함) ---
        let isRolling = false;

        const runDraw = () => {
            if (state.participants.length < 1 || isRolling) return;

            // 성별 모드에 따라 뽑기 대상 풀 결정
            const genderMode = state.settings.genderMode || 'all';
            let pool = state.participants;

            if (genderMode === 'M' || genderMode === 'F') {
                pool = state.participants.filter(p => p.gender === genderMode);
                if (pool.length < 1) {
                    showToast(`${genderMode === 'M' ? '남자' : '여자'} 참가자가 없어 뽑을 수 없습니다.`, 'error');
                    return;
                }
            } else if (genderMode === 'alternate') {
                const lastGender = state.history[0]?.gender || null;
                if (lastGender) {
                    const opposite = lastGender === 'M' ? 'F' : 'M';
                    const oppositePool = state.participants.filter(p => p.gender === opposite);
                    if (oppositePool.length > 0) {
                        pool = oppositePool;
                    } else {
                        showToast('반대 성별 참가자가 없어 전체 명단에서 뽑습니다.', 'info');
                    }
                }
            }

            initAudio();
            isRolling = true;

            // UI 셋업
            dom.resultName.style.display = '';
            dom.resultTeams.classList.add('hidden');
            dom.exportTeamCsv.style.display = 'none';
            dom.resultTitle.style.display = 'none';
            dom.closeModal.style.display = 'none';
            dom.continueDraw.style.display = 'none';
            dom.resultOverlay.classList.remove('hidden');
            setTimeout(() => dom.resultOverlay.classList.remove('opacity-0'), 10);

            const speedMultiplier = state.settings.animSpeed;
            const rollDuration = 3000 / speedMultiplier;
            const rollInterval = 60 / speedMultiplier;
            let currentIdx = -1;

            const rollingTimer = setInterval(() => {
                let nextIdx;
                do { nextIdx = Math.floor(Math.random() * pool.length); }
                while (nextIdx === currentIdx && pool.length > 1);
                currentIdx = nextIdx;
                const rollingName = pool[currentIdx].name;
                dom.resultName.textContent = rollingName;
                dom.resultName.className = `px-2 ${getMobileNameSizeClass(rollingName)} sm:text-6xl md:text-8xl lg:text-[8rem] font-bold text-white/80 rolling-control blur-[2px] transition-all text-center break-keep`;
                playSound('tick');
            }, rollInterval);

            setTimeout(() => {
                clearInterval(rollingTimer);

                const winnerIdx = Math.floor(Math.random() * pool.length);
                const winner = pool[winnerIdx];

                // 기록 저장
                const now = new Date();
                const recordId = Date.now();
                state.history.unshift({ id: recordId, name: winner.name, gender: winner.gender, date: now.toLocaleString(), dayKey: toDayKey(now) });
                saveState('history');
                renderHistoryList();

                // 최종 결과 노출 디자인
                dom.resultName.textContent = winner.name;
                dom.resultName.className = `px-2 ${getMobileNameSizeClass(winner.name)} sm:text-7xl md:text-[10rem] lg:text-[12rem] font-black text-white text-center break-keep drop-shadow-[0_0_60px_var(--theme-primary)] blur-0 transition-all duration-300 transform scale-110`;

                dom.resultTitle.style.display = 'inline-block';
                dom.closeModal.style.display = 'flex';

                playSound('success');
                fireConfetti();

                // 제외 모드
                if (state.settings.excludeMode) {
                    const realIdx = state.participants.findIndex(p => p.name === winner.name);
                    if (realIdx !== -1) {
                        state.excluded.push({ ...state.participants[realIdx], excludedByRecordId: recordId });
                        state.participants.splice(realIdx, 1);
                    }
                    saveState('participants');
                    saveState('excluded');
                    renderParticipants();
                    setTimeout(() => showToast(`'${winner.name}' 님이 다음 뽑기에서 제외되었습니다. ('전체 복원'으로 되돌릴 수 있어요)`), 1000);
                }

                dom.continueDraw.style.display = state.participants.length >= 1 ? 'flex' : 'none';
                isRolling = false;

            }, rollDuration);
        };

        let lastTeamResult = null; // 마지막으로 그린 팀 배분 결과 (CSV 내보내기/재열람용)

        // 글씨 크기를 실측(이분 탐색)으로 최대한 키우되, 계산이 혹시 틀리더라도 절대 옆 이름과
        // 겹치지는 않도록 이중 안전장치를 둔다:
        //  1) ul 전체가 아니라 각 li를 "개별로" 검사한다 — 이름 하나가 자기 칸을 넘어 옆 li로
        //     넘치면 ul 전체 기준 크기는 안 넘친 것처럼 보일 수 있어서, li마다 자기 자신의
        //     scrollWidth/Height가 자기 clientWidth/Height를 넘는지 각각 확인한다.
        //  2) 그래도 혹시 안 맞는 경우를 대비해, li 자체에 white-space:nowrap(이름이 글자 단위로
        //     줄바꿈되어 첫 글자만 보이는 문제를 막기 위함)과 overflow:hidden + text-overflow:ellipsis
        //     (그래도 안 맞으면 "..."으로 잘림)를 CSS로 걸어 둔다. 즉 "측정이 완벽하지 않아도 겹침은
        //     구조적으로 불가능"하다.
        const fitTextToBox = (el, { max = 120, min = 12 } = {}) => {
            const items = [...el.querySelectorAll('li')];
            const fits = (size) => {
                el.style.fontSize = size + 'px';
                return items.every(li => li.scrollWidth <= li.clientWidth + 1 && li.scrollHeight <= li.clientHeight + 1);
            };
            let lo = min, hi = max;
            if (!fits(min)) return min; // 최소 크기로도 안 맞으면(극단적으로 긴 이름 등) 최소로 둔다(overflow-wrap/hidden이 안전망)
            while (hi - lo > 1) {
                const mid = Math.floor((lo + hi) / 2);
                if (fits(mid)) lo = mid; else hi = mid;
            }
            fits(lo);
            return lo;
        };

        // 중요: align-items를 center로 두면 grid item(li)이 자기 트랙 크기로 눌리지 않고
        // "내용 그대로의 크기"를 유지해서, li.scrollHeight가 항상 li.clientHeight와 같아져
        // 넘침 측정이 무의미해진다(li가 트랙 밖으로 삐져나가도 li 입장에선 "안 넘친 것"으로 보임).
        // 그래서 기본값인 stretch를 써서 li 박스 자체가 트랙 크기로 눌리게 하고, 텍스트는
        // li를 flex로 만들어 그 안에서 가운데 정렬한다 — 이래야 트랙보다 큰 내용이 진짜로
        // li.scrollHeight/Width를 li.clientHeight/Width보다 크게 만들어 측정에 잡힌다.
        const applyMemberGrid = (el, cols) => {
            const memberCount = el.querySelectorAll('li').length;
            const rowsPerCol = Math.max(1, Math.ceil(memberCount / cols));
            el.style.display = 'grid';
            el.style.gridAutoFlow = 'column';
            el.style.gridTemplateRows = `repeat(${rowsPerCol}, minmax(0, 1fr))`;
            el.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
            el.style.columnGap = '1.5rem';
            el.style.rowGap = '0.25rem';
        };

        const fitMemberList = (el) => {
            const memberCount = el.querySelectorAll('li').length;
            const maxCols = Math.max(1, Math.min(4, memberCount));
            let bestCols = 1, bestSize = 0;
            for (let cols = 1; cols <= maxCols; cols++) {
                applyMemberGrid(el, cols);
                const size = fitTextToBox(el);
                if (size > bestSize) { bestSize = size; bestCols = cols; }
            }
            applyMemberGrid(el, bestCols);
            el.style.fontSize = bestSize + 'px';
        };

        const refitAllTeamCards = () => {
            if (dom.resultTeams.classList.contains('hidden')) return;
            [...dom.resultTeams.querySelectorAll('.team-members')].forEach(fitMemberList);
        };

        let teamResizeDebounce = null;
        new ResizeObserver(() => {
            clearTimeout(teamResizeDebounce);
            teamResizeDebounce = setTimeout(refitAllTeamCards, 150);
        }).observe(dom.resultTeams);

        // 팀 카드를 한눈에 구분할 수 있도록 순서대로 돌려가며 입히는 배경/테두리 색
        const TEAM_CARD_COLORS = [
            { bg: 'bg-violet-500/30', border: 'border-violet-400/60' },
            { bg: 'bg-blue-500/30', border: 'border-blue-400/60' },
            { bg: 'bg-rose-500/30', border: 'border-rose-400/60' },
            { bg: 'bg-emerald-500/30', border: 'border-emerald-400/60' },
            { bg: 'bg-amber-500/30', border: 'border-amber-400/60' },
            { bg: 'bg-cyan-500/30', border: 'border-cyan-400/60' },
            { bg: 'bg-pink-500/30', border: 'border-pink-400/60' },
            { bg: 'bg-lime-500/30', border: 'border-lime-400/60' },
        ];

        const renderTeamResultOverlay = (teams, { allowContinue = true } = {}) => {
            dom.resultName.style.display = 'none';
            dom.resultTitle.style.display = 'none';
            dom.resultTeams.classList.remove('hidden');

            // 팀마다 크기가 같은 세로 막대(bar) 하나씩, 한 줄에 나란히 배치해 화면 높이를 그대로 다 쓴다.
            dom.resultTeams.style.gridTemplateRows = '1fr';
            dom.resultTeams.style.gridTemplateColumns = `repeat(${teams.length}, minmax(0, 1fr))`;

            dom.resultTeams.innerHTML = teams.map((team, i) => {
                const color = TEAM_CARD_COLORS[i % TEAM_CARD_COLORS.length];
                // 이전 버전 히스토리 기록은 members가 이름 문자열 배열이라, 재열람 시에도 깨지지
                // 않도록 {name, gender, ability} 객체로 정규화한다.
                const members = team.members.map(m => typeof m === 'string' ? { name: m, gender: null, ability: null } : m);
                const mCount = members.filter(m => m.gender === 'M').length;
                const fCount = members.filter(m => m.gender === 'F').length;
                const genderBadge = (mCount > 0 || fCount > 0)
                    ? `<p class="text-white/80 font-bold text-xs sm:text-sm mb-2 text-center shrink-0">남 ${mCount} · 여 ${fCount}</p>`
                    : '';
                const highCount = members.filter(m => m.ability === '상').length;
                const midCount = members.filter(m => m.ability === '중').length;
                const lowCount = members.filter(m => m.ability === '하').length;
                const abilityBadge = (highCount > 0 || midCount > 0 || lowCount > 0)
                    ? `<p class="text-white/80 font-bold text-xs sm:text-sm mb-2 text-center shrink-0">상 ${highCount} · 중 ${midCount} · 하 ${lowCount}</p>`
                    : '';
                return `
                    <div class="team-card h-full min-h-0 ${color.bg} backdrop-blur rounded-2xl border-2 ${color.border} p-4 sm:p-6 flex flex-col overflow-hidden">
                        <p class="text-white font-black text-2xl sm:text-3xl mb-1 text-center shrink-0">${escapeHtml(team.name)}</p>
                        ${genderBadge}
                        ${abilityBadge}
                        <ul class="team-members flex-1 min-h-0 overflow-hidden text-white/90 font-bold text-center">
                            ${members.map(m => `<li class="min-w-0 min-h-0 overflow-hidden flex items-center justify-center text-center" style="white-space:nowrap;text-overflow:ellipsis;">${escapeHtml(m.name)}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }).join('');

            // 레이아웃이 실제로 잡힌 다음 프레임에 측정해야 카드 크기가 정확하다. Pretendard 웹폰트가
            // 아직 로딩 중일 때 측정하면 폭이 다른 폴백 글꼴 기준으로 계산될 수 있어, 폰트 로딩이
            // 끝난 뒤에 측정하도록 기다린다.
            requestAnimationFrame(() => {
                const fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
                fontsReady.then(refitAllTeamCards);
            });

            dom.closeModal.style.display = 'flex';
            dom.continueDraw.style.display = allowContinue ? 'flex' : 'none';
            dom.exportTeamCsv.style.display = 'flex';

            dom.resultOverlay.classList.remove('hidden');
            setTimeout(() => dom.resultOverlay.classList.remove('opacity-0'), 10);
        };

        const isTeamMode = () => state.settings.genderMode === 'team';

        const runTeamDraw = () => {
            // 팀 나누기는 1회성 제외 모드로 빠진 참가자도 포함한 전체 명단을 대상으로 한다.
            const fullRoster = [...state.participants, ...state.excluded];
            if (fullRoster.length < 1 || isRolling) return;

            const ts = state.settings.teamSettings;
            const rawCount = TeamDrawLogic.resolveTeamCount(ts, fullRoster.length);

            if (rawCount < 2) {
                showToast('팀은 2개 이상이어야 합니다.', 'error');
                return;
            }
            if (rawCount > fullRoster.length) {
                showToast('참가자 수보다 팀이 많을 수 없습니다.', 'error');
                return;
            }

            initAudio();

            const teams = TeamDrawLogic.distributeTeams(fullRoster, rawCount, {
                balanceGender: ts.balanceGender,
                balanceAbility: ts.balanceAbility
            });
            lastTeamResult = teams;

            const now = new Date();
            state.history.unshift({ id: Date.now(), type: 'team', teamCount: teams.length, date: now.toLocaleString(), dayKey: toDayKey(now), teams });
            saveState('history');
            renderHistoryList();

            renderTeamResultOverlay(teams);
            playSound('success');
            fireConfetti();
        };

        dom.exportTeamCsv.addEventListener('click', () => {
            if (!lastTeamResult) return;
            // 능력(상/중/하) 균형은 학생에게 보이는 화면(팀 카드)에는 노출하지 않고,
            // 교사가 나중에 따로 열어보는 이 CSV 파일에만 열로 담는다.
            const abilityLabel = { 상: '상', 중: '중', 하: '하' };
            const abilityRank = { 상: 0, 중: 1, 하: 2 }; // 미지정은 가장 뒤로
            const lines = ['팀,이름,능력'];
            lastTeamResult.forEach(team => {
                const members = team.members.map(m => typeof m === 'string' ? { name: m, ability: null } : m);
                const sorted = [...members].sort((a, b) => (abilityRank[a.ability] ?? 3) - (abilityRank[b.ability] ?? 3));
                sorted.forEach(m => {
                    const ability = abilityLabel[m.ability] || '';
                    lines.push(`${team.name},${csvField(m.name)},${csvField(ability)}`);
                });
            });
            const csvContent = '﻿' + lines.join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const today = new Date().toISOString().slice(0, 10).replace(/-/g, '');
            const a = document.createElement('a');
            a.href = url;
            a.download = `팀배분_${today}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('팀 배분 결과를 내보냈습니다.', 'success');
        });

        dom.drawBtn.addEventListener('click', () => {
            if (isTeamMode()) runTeamDraw();
            else runDraw();
        });

        dom.continueDraw.addEventListener('click', () => {
            playSound('click');
            if (isTeamMode()) runTeamDraw();
            else runDraw();
        });

        dom.closeModal.addEventListener('click', () => {
            playSound('click');
            dom.resultOverlay.classList.add('opacity-0');
            clearConfetti();
            setTimeout(() => {
                dom.resultOverlay.classList.add('hidden');
            }, 500);
        });

        // --- 8. 통계 & 히스토리 (상시 표시) ---
        dom.btnClearHistory.addEventListener('click', () => {
            showConfirm('기록 삭제', '모든 당첨 기록을 삭제하시겠습니까? 복구할 수 없습니다.', () => {
                state.history = [];
                saveState('history');
                renderHistoryList();
                showToast('기록이 삭제되었습니다.');
            });
        });

        dom.historyDateFilter.addEventListener('change', () => renderHistoryList());

        const renderHistoryList = () => {
            dom.historyList.innerHTML = '';
            const selectedDay = dom.historyDateFilter.value;
            const filtered = state.history.filter(record => getRecordDayKey(record) === selectedDay);

            if (filtered.length === 0) {
                dom.historyList.innerHTML = `<li class="text-center text-slate-400 py-10 text-sm">이 날짜의 기록이 없습니다.</li>`;
                return;
            }

            // 상위 50개만 렌더링 (퍼포먼스 고려)
            filtered.slice(0, 50).forEach(record => {
                const li = document.createElement('li');
                li.className = 'flex justify-between items-center bg-white dark:bg-slate-800 p-3 border border-slate-100 dark:border-slate-700 rounded-xl shadow-sm';

                if (record.type === 'team') {
                    li.innerHTML = `
                        <div class="flex items-center gap-3 overflow-hidden cursor-pointer" onclick="reopenTeamResult(${record.id})">
                            <div class="w-10 h-10 rounded-full bg-theme/10 text-theme flex items-center justify-center shrink-0"><i class="fa-solid fa-people-group"></i></div>
                            <div class="truncate">
                                <p class="font-bold text-slate-700 dark:text-slate-200 text-base truncate">${record.teamCount}팀 배분 완료</p>
                                <p class="text-xs text-slate-400">${record.date}</p>
                            </div>
                        </div>
                        <button onclick="removeHistoryRecord(${record.id})" class="text-slate-300 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-500/10 w-8 h-8 rounded-full flex items-center justify-center transition-colors shrink-0" title="기록 삭제">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    `;
                } else {
                    li.innerHTML = `
                        <div class="flex items-center gap-3 overflow-hidden">
                            <div class="w-10 h-10 rounded-full bg-theme/10 text-theme flex items-center justify-center shrink-0"><i class="fa-solid fa-trophy"></i></div>
                            <div class="truncate">
                                <p class="font-bold text-slate-700 dark:text-slate-200 text-base truncate">${escapeHtml(record.name)}</p>
                                <p class="text-xs text-slate-400">${record.date}</p>
                            </div>
                        </div>
                        <button onclick="removeHistoryRecord(${record.id})" class="text-slate-300 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-500/10 w-8 h-8 rounded-full flex items-center justify-center transition-colors shrink-0" title="기록 삭제">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    `;
                }
                dom.historyList.appendChild(li);
            });
        };

        window.removeHistoryRecord = (id) => {
            const record = state.history.find(r => r.id === id);
            state.history = state.history.filter(r => r.id !== id);
            saveState('history');
            renderHistoryList();

            // 제외 모드로 명단에서 빠져있는 사람이면, 기록 삭제와 함께 명단으로 복원
            // (단, 지금 삭제하는 기록이 실제로 그 사람을 제외시킨 기록일 때만 복원)
            if (record) {
                const excludedIdx = state.excluded.findIndex(p => p.name === record.name && p.excludedByRecordId === record.id);
                if (excludedIdx !== -1) {
                    const [restoredRaw] = state.excluded.splice(excludedIdx, 1);
                    const { excludedByRecordId, ...restored } = restoredRaw;
                    if (!state.participants.some(p => p.name === restored.name)) {
                        state.participants.push(restored);
                    }
                    saveState('excluded');
                    saveState('participants');
                    renderParticipants();
                    showToast(`'${restored.name}' 님이 명단으로 복원되었습니다.`, 'success');
                }
            }
        };

        window.reopenTeamResult = (id) => {
            const record = state.history.find(r => r.id === id && r.type === 'team');
            if (!record) return;
            lastTeamResult = record.teams;
            dom.continueDraw.style.display = 'none';
            renderTeamResultOverlay(record.teams, { allowContinue: false });
        };

        // --- 9. 폭죽 (Confetti) 효과 ---
        let particles = [];
        let animationId;

        const resizeCanvas = () => {
            dom.confettiCanvas.width = window.innerWidth;
            dom.confettiCanvas.height = window.innerHeight;
        };
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const fireConfetti = () => {
            particles = [];
            const colors = ['#fde047', '#3b82f6', state.settings.primaryColor, '#ec4899', '#10b981', '#ffffff'];
            
            for (let i = 0; i < 300; i++) {
                particles.push({
                    x: dom.confettiCanvas.width / 2, 
                    y: dom.confettiCanvas.height / 2,
                    r: Math.random() * 6 + 4,
                    dx: Math.random() * 40 - 20,
                    dy: Math.random() * -30 - 10,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.floor(Math.random() * 10) - 10,
                    tiltAngleInc: (Math.random() * 0.07) + 0.05,
                    tiltAngle: 0,
                    shape: Math.random() > 0.5 ? 'circle' : 'rect'
                });
            }
            animateConfetti();
        };

        const animateConfetti = () => {
            ctx.clearRect(0, 0, dom.confettiCanvas.width, dom.confettiCanvas.height);
            let activeParticles = 0;

            particles.forEach((p) => {
                p.tiltAngle += p.tiltAngleInc;
                p.y += (Math.cos(p.tiltAngle) + 1 + p.r / 2) / 2;
                p.x += Math.sin(p.tiltAngle) * 2 + p.dx; 
                p.dy += 0.5; 
                p.y += p.dy; 

                if (p.y <= dom.confettiCanvas.height) activeParticles++;

                ctx.beginPath();
                ctx.lineWidth = p.r;
                ctx.strokeStyle = p.color;
                ctx.fillStyle = p.color;

                if(p.shape === 'circle') {
                    ctx.arc(p.x, p.y, p.r/2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.moveTo(p.x + p.tilt + p.r, p.y);
                    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
                    ctx.stroke();
                }
            });

            if (activeParticles > 0) animationId = requestAnimationFrame(animateConfetti);
        };

        const clearConfetti = () => {
            particles = [];
            ctx.clearRect(0, 0, dom.confettiCanvas.width, dom.confettiCanvas.height);
            if (animationId) cancelAnimationFrame(animationId);
        };

        // --- 10. 앱 초기화 ---
        applySettingsToDOM();
        renderParticipants();
        dom.historyDateFilter.value = toDayKey(new Date());
        renderHistoryList();
        if (hadCorruptedStorage) {
            showToast('저장된 데이터 일부가 손상되어 초기화했습니다. 명단을 확인해주세요.', 'error');
        }

    </script>
</body>
</html>
