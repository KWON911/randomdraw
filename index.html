<!DOCTYPE html>
<html lang="ko" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고급 발표자 뽑기 (PC Pro)</title>
    
    <!-- 폰트 -->
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
    
    <!-- 아이콘 & 라이브러리 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <!-- 동적 테마 설정을 위한 CSS 변수 및 스타일 -->
    <style>
        :root {
            --theme-primary: #8b5cf6;
            --theme-primary-hover: #7c3aed;
            --theme-gradient-start: #8b5cf6;
            --theme-gradient-end: #3b82f6;
            --font-main: 'Pretendard', sans-serif;
            --anim-speed: 1; 
        }

        body {
            font-family: var(--font-main);
            transition: background-color 0.3s ease;
        }

        /* 테마 유틸리티 */
        .bg-theme { background-color: var(--theme-primary); }
        .text-theme { color: var(--theme-primary); }
        .border-theme { border-color: var(--theme-primary); }
        .focus-ring-theme:focus { box-shadow: 0 0 0 2px var(--theme-primary); }
        .bg-theme-gradient { background: linear-gradient(135deg, var(--theme-gradient-start), var(--theme-gradient-end)); }
        
        /* 배경 패턴 */
        body.pattern-dots { background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px); background-size: 24px 24px; }
        body.pattern-grid { background-image: linear-gradient(#cbd5e1 1px, transparent 1px), linear-gradient(90deg, #cbd5e1 1px, transparent 1px); background-size: 20px 20px; }
        body.pattern-waves { background: repeating-radial-gradient(circle at 0 0, transparent 0, #f1f5f9 10px, transparent 10px, #e2e8f0 20px); }
        html.dark body.pattern-dots { background-image: radial-gradient(#334155 1.5px, transparent 1.5px); }
        html.dark body.pattern-grid { background-image: linear-gradient(#334155 1px, transparent 1px), linear-gradient(90deg, #334155 1px, transparent 1px); }
        html.dark body.pattern-waves { background: repeating-radial-gradient(circle at 0 0, transparent 0, #0f172a 10px, transparent 10px, #1e293b 20px); }

        html.dark body { background-color: #0f172a; color: #f8fafc; }
        body { background-color: #f8fafc; }

        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        html.dark ::-webkit-scrollbar-thumb { background: #475569; }

        /* 애니메이션 */
        .anim-control { animation-duration: calc(1s / var(--anim-speed)) !important; }
        .rolling-control { transition-duration: calc(0.1s / var(--anim-speed)) !important; }

        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOutRight { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
        .toast-enter { animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .toast-exit { animation: fadeOutRight 0.3s ease-in forwards; }

        #confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }
        .sortable-ghost { opacity: 0.4; background-color: #f1f5f9; border: 2px dashed var(--theme-primary); }
        html.dark .sortable-ghost { background-color: #1e293b; }
    </style>
</head>
<body class="pattern-dots min-h-screen flex items-center justify-center p-6 overflow-hidden">

    <!-- PC 최적화 3단 그리드 레이아웃 -->
    <div class="w-full max-w-[1600px] h-[85vh] min-h-[700px] grid grid-cols-1 lg:grid-cols-12 gap-6 relative z-10">

        <!-- ==========================================
             [1] 왼쪽 패널: 히스토리 & 통계 
             ========================================== -->
        <aside class="lg:col-span-3 bg-white dark:bg-slate-800 rounded-3xl shadow-2xl flex flex-col border border-slate-200 dark:border-slate-700 overflow-hidden transition-colors">
            <div class="p-5 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-800/80">
                <h2 class="text-lg font-bold text-slate-800 dark:text-white"><i class="fa-solid fa-chart-column mr-2 text-theme"></i>히스토리 & 통계</h2>
                <button id="clear-history" class="text-xs text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 px-2 py-1 rounded transition-colors" title="기록 전체 삭제">
                    <i class="fa-solid fa-trash"></i>
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto flex flex-col p-5">
                <!-- 통계 차트 -->
                <div class="mb-6 shrink-0">
                    <h3 class="text-xs font-bold text-slate-400 dark:text-slate-500 mb-3 uppercase tracking-wider">Top 5 당첨자</h3>
                    <div class="bg-slate-50 dark:bg-slate-900 rounded-xl p-3 border border-slate-100 dark:border-slate-700 h-48 relative">
                        <canvas id="statsChart"></canvas>
                    </div>
                </div>

                <!-- 히스토리 목록 -->
                <div class="flex-1 flex flex-col min-h-0">
                    <h3 class="text-xs font-bold text-slate-400 dark:text-slate-500 mb-3 uppercase tracking-wider">타임라인</h3>
                    <ul id="history-list" class="space-y-3 flex-1 overflow-y-auto pr-2 pb-2">
                        <!-- 동적 렌더링 -->
                    </ul>
                </div>
            </div>
        </aside>

        <!-- ==========================================
             [2] 중앙 패널: 메인 뽑기 영역 
             ========================================== -->
        <main class="lg:col-span-6 bg-white dark:bg-slate-800 rounded-3xl shadow-2xl flex flex-col border border-slate-200 dark:border-slate-700 overflow-hidden transition-colors relative">
            
            <!-- Hero Header -->
            <header class="relative bg-theme-gradient p-8 text-center shrink-0 transition-all overflow-hidden">
                <div class="absolute inset-0 opacity-20" style="background-image: radial-gradient(circle at 2px 2px, white 1px, transparent 0); background-size: 20px 20px;"></div>
                <div class="mt-2 flex justify-center relative z-10">
                    <div class="w-20 h-20 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center mb-4 shadow-lg ring-1 ring-white/30 transform hover:scale-105 transition-transform">
                        <i class="fa-solid fa-dice-d20 text-4xl text-white drop-shadow-md"></i>
                    </div>
                </div>
                <h1 class="text-3xl font-bold text-white tracking-wide relative z-10 drop-shadow-sm">오늘의 발표자</h1>
                <p class="text-white/80 mt-2 text-sm relative z-10">긴장되는 순간, 행운의 주인공을 뽑아보세요!</p>
            </header>

            <!-- Input & Toolbar -->
            <div class="px-8 -mt-6 relative z-20 shrink-0">
                <form id="add-form" class="bg-white dark:bg-slate-900 p-2.5 rounded-2xl shadow-xl border border-slate-100 dark:border-slate-700 flex gap-2">
                    <input type="text" id="name-input" class="flex-1 px-4 py-3 text-lg bg-slate-50 dark:bg-slate-800 rounded-xl text-slate-800 dark:text-slate-100 focus:outline-none focus-ring-theme transition-shadow placeholder-slate-400" placeholder="참가자 이름 입력 후 Enter" autocomplete="off">
                    <button type="submit" class="bg-theme text-white w-16 rounded-xl flex items-center justify-center transition-transform hover:scale-105 active:scale-95 shadow-md">
                        <i class="fa-solid fa-plus text-xl"></i>
                    </button>
                </form>
            </div>

            <div class="px-8 py-4 flex justify-between items-center border-b border-slate-100 dark:border-slate-700 bg-transparent shrink-0 mt-2">
                <label class="flex items-center gap-2 text-sm font-semibold text-slate-600 dark:text-slate-300 cursor-pointer select-none group">
                    <div class="relative">
                        <input type="checkbox" id="toggle-exclude" class="sr-only peer">
                        <div class="w-10 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer dark:bg-slate-600 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-theme"></div>
                    </div>
                    <span class="group-hover:text-theme transition-colors">당첨자 1회성 제외 모드</span>
                </label>
                <div class="flex items-center gap-3">
                    <button id="reset-list" class="text-xs font-semibold text-slate-400 hover:text-red-500 transition-colors"><i class="fa-solid fa-rotate-right mr-1"></i>명단 초기화</button>
                    <span class="text-sm bg-slate-100 dark:bg-slate-700 px-3 py-1.5 rounded-lg font-bold text-slate-600 dark:text-slate-300">
                        총 <span id="count-badge" class="text-theme text-lg">0</span>명
                    </span>
                </div>
            </div>

            <!-- Participant List -->
            <div class="flex-1 overflow-y-auto p-8 relative bg-slate-50/50 dark:bg-slate-800/50">
                <ul id="participant-list" class="grid grid-cols-1 md:grid-cols-2 gap-3 pb-4">
                    <!-- 동적 렌더링 -->
                </ul>
                <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400">
                    <div class="w-24 h-24 bg-slate-100 dark:bg-slate-700 rounded-full flex items-center justify-center mb-4">
                        <i class="fa-solid fa-user-group text-4xl opacity-50"></i>
                    </div>
                    <p class="font-medium text-lg">참가자가 없습니다.</p>
                    <p class="text-sm mt-1">상단에서 이름을 추가해주세요.</p>
                </div>
            </div>

            <!-- Draw Button -->
            <div class="p-8 bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-700 shrink-0">
                <button id="draw-btn" disabled class="w-full h-20 bg-theme-gradient text-white text-2xl font-black rounded-2xl shadow-xl hover:shadow-2xl hover:shadow-theme/30 transform transition-all hover:-translate-y-1 active:translate-y-0 active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none flex items-center justify-center gap-4 tracking-widest overflow-hidden relative group">
                    <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></div>
                    <i class="fa-solid fa-wand-magic-sparkles text-3xl relative z-10"></i> 
                    <span class="relative z-10">운명의 뽑기 시작!</span>
                </button>
            </div>
        </main>

        <!-- ==========================================
             [3] 오른쪽 패널: 커스터마이징 & 설정 
             ========================================== -->
        <aside class="lg:col-span-3 bg-white dark:bg-slate-800 rounded-3xl shadow-2xl flex flex-col border border-slate-200 dark:border-slate-700 overflow-hidden transition-colors">
            <div class="p-5 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-800/80">
                <h2 class="text-lg font-bold text-slate-800 dark:text-white"><i class="fa-solid fa-palette mr-2 text-theme"></i>테마 & 설정</h2>
            </div>
            
            <div class="flex-1 overflow-y-auto p-6 space-y-7 text-sm text-slate-700 dark:text-slate-300">
                
                <!-- 색상 선택 -->
                <div>
                    <label class="block font-bold mb-3 text-slate-800 dark:text-white">브랜드 컬러</label>
                    <div class="flex gap-3">
                        <input type="color" id="color-picker" class="w-10 h-10 p-0 border-0 rounded cursor-pointer" value="#8b5cf6">
                        <button class="color-preset w-10 h-10 rounded-full bg-[#8b5cf6] shadow-sm hover:scale-110 transition-transform focus-ring-theme" data-color="#8b5cf6"></button>
                        <button class="color-preset w-10 h-10 rounded-full bg-[#3b82f6] shadow-sm hover:scale-110 transition-transform focus:ring-[#3b82f6]" data-color="#3b82f6"></button>
                        <button class="color-preset w-10 h-10 rounded-full bg-[#ec4899] shadow-sm hover:scale-110 transition-transform focus:ring-[#ec4899]" data-color="#ec4899"></button>
                        <button class="color-preset w-10 h-10 rounded-full bg-[#10b981] shadow-sm hover:scale-110 transition-transform focus:ring-[#10b981]" data-color="#10b981"></button>
                        <button class="color-preset w-10 h-10 rounded-full bg-[#f59e0b] shadow-sm hover:scale-110 transition-transform focus:ring-[#f59e0b]" data-color="#f59e0b"></button>
                    </div>
                </div>

                <!-- 다크모드 -->
                <div class="flex justify-between items-center bg-slate-50 dark:bg-slate-900 p-4 rounded-xl border border-slate-100 dark:border-slate-700">
                    <span class="font-bold text-slate-800 dark:text-white"><i class="fa-solid fa-moon mr-2 text-slate-400"></i>다크 모드</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="theme-toggle" class="sr-only peer">
                        <div class="w-12 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer dark:bg-slate-600 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-theme"></div>
                    </label>
                </div>

                <!-- 효과음 -->
                <div class="flex justify-between items-center bg-slate-50 dark:bg-slate-900 p-4 rounded-xl border border-slate-100 dark:border-slate-700">
                    <span class="font-bold text-slate-800 dark:text-white"><i class="fa-solid fa-volume-high mr-2 text-slate-400"></i>사운드 효과</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="sound-toggle" class="sr-only peer" checked>
                        <div class="w-12 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer dark:bg-slate-600 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-theme"></div>
                    </label>
                </div>

                <!-- 배경 패턴 -->
                <div>
                    <label class="block font-bold mb-2 text-slate-800 dark:text-white">배경 패턴</label>
                    <select id="pattern-select" class="w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus-ring-theme text-sm">
                        <option value="pattern-dots">도트 (Dots)</option>
                        <option value="pattern-grid">그리드 (Grid)</option>
                        <option value="pattern-waves">웨이브 (Waves)</option>
                        <option value="none">없음 (단색)</option>
                    </select>
                </div>

                <!-- 폰트 -->
                <div>
                    <label class="block font-bold mb-2 text-slate-800 dark:text-white">글꼴 (Font)</label>
                    <select id="font-select" class="w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus-ring-theme text-sm">
                        <option value="'Pretendard', sans-serif">Pretendard (기본/깔끔)</option>
                        <option value="'Noto Sans KR', sans-serif">Noto Sans KR (고딕)</option>
                        <option value="'Jua', sans-serif">배달의민족 주아 (귀여움)</option>
                        <option value="'Gowun Dodum', sans-serif">고운돋움 (단정함)</option>
                    </select>
                </div>

                <!-- 애니메이션 속도 -->
                <div class="bg-slate-50 dark:bg-slate-900 p-4 rounded-xl border border-slate-100 dark:border-slate-700">
                    <label class="flex justify-between font-bold mb-3 text-slate-800 dark:text-white">
                        <span>애니메이션 배속</span> 
                        <span id="speed-val" class="text-theme">1.0x</span>
                    </label>
                    <input type="range" id="speed-slider" min="0.5" max="2" step="0.1" value="1" class="w-full h-2 bg-slate-300 rounded-lg appearance-none cursor-pointer dark:bg-slate-600 accent-theme-primary">
                    <div class="flex justify-between text-xs text-slate-400 mt-2 font-medium">
                        <span>느리게</span><span>빠르게</span>
                    </div>
                </div>

                <div class="pt-2">
                    <button id="reset-settings" class="w-full py-3 text-slate-500 hover:text-slate-700 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl font-bold transition-colors"><i class="fa-solid fa-arrow-rotate-left mr-2"></i>기본 설정으로 복구</button>
                </div>
            </div>
        </aside>

    </div>

    <!-- 뽑기 결과 모달 (전체화면 덮기) -->
    <div id="result-overlay" class="fixed inset-0 bg-slate-900/90 backdrop-blur-lg z-[60] hidden flex flex-col items-center justify-center opacity-0 transition-opacity duration-500">
        <div id="result-title" class="text-theme font-bold mb-8 text-3xl tracking-widest hidden bg-white px-8 py-3 rounded-full shadow-2xl border-4 border-theme transform -translate-y-10">
            <i class="fa-solid fa-crown text-yellow-500 mr-3"></i>최종 당첨자
        </div>
        
        <div id="result-name" class="text-7xl md:text-9xl lg:text-[10rem] font-black text-white text-center break-keep tracking-widest drop-shadow-[0_0_50px_rgba(255,255,255,0.3)]"></div>
        
        <button id="close-modal" class="mt-20 text-white bg-white/10 hover:bg-theme border-2 border-white/30 hover:border-transparent rounded-full px-10 py-4 font-bold text-xl transition-all duration-300 hidden items-center gap-3 shadow-2xl hover:scale-105 active:scale-95">
            <i class="fa-solid fa-check"></i> 결과 확인완료
        </button>
    </div>

    <!-- 토스트 알림 컨테이너 -->
    <div id="toast-container" class="fixed bottom-8 right-8 z-[70] flex flex-col gap-3 pointer-events-none"></div>

    <!-- 폭죽 캔버스 -->
    <canvas id="confetti-canvas"></canvas>

    <!-- 앱 로직 -->
    <script>
        // --- 1. DOM 요소 캐싱 ---
        const dom = {
            html: document.documentElement,
            body: document.body,
            form: document.getElementById('add-form'),
            input: document.getElementById('name-input'),
            list: document.getElementById('participant-list'),
            countBadge: document.getElementById('count-badge'),
            emptyState: document.getElementById('empty-state'),
            drawBtn: document.getElementById('draw-btn'),
            toggleExclude: document.getElementById('toggle-exclude'),
            resetListBtn: document.getElementById('reset-list'),
            
            // 모달/오버레이
            resultOverlay: document.getElementById('result-overlay'),
            resultName: document.getElementById('result-name'),
            resultTitle: document.getElementById('result-title'),
            closeModal: document.getElementById('close-modal'),
            toastContainer: document.getElementById('toast-container'),
            confettiCanvas: document.getElementById('confetti-canvas'),
            
            // 히스토리 패널
            historyList: document.getElementById('history-list'),
            btnClearHistory: document.getElementById('clear-history'),
            
            // 설정 패널
            colorPicker: document.getElementById('color-picker'),
            colorPresets: document.querySelectorAll('.color-preset'),
            themeToggle: document.getElementById('theme-toggle'),
            patternSelect: document.getElementById('pattern-select'),
            fontSelect: document.getElementById('font-select'),
            speedSlider: document.getElementById('speed-slider'),
            speedVal: document.getElementById('speed-val'),
            soundToggle: document.getElementById('sound-toggle'),
            resetSettings: document.getElementById('reset-settings'),
        };

        const ctx = dom.confettiCanvas.getContext('2d');
        let chartInstance = null;

        // --- 2. 기본 데이터 및 상태 관리 ---
        const DEFAULT_STUDENTS = [
            "구태리", "김고은", "김도윤", "김태연", "김태윤", "김하윤", "도예준", "박새봄", "박태경", 
            "배찬영", "손무빈", "손유진", "엄서현", "윤한서", "이선우", "이윤서", "이지한", "이지훈", 
            "임서유", "차아영", "최준우", "최지우", "홍승아", "홍현준", "황서륜"
        ];

        const DEFAULT_SETTINGS = {
            primaryColor: '#8b5cf6',
            darkMode: false,
            pattern: 'pattern-dots',
            font: "'Pretendard', sans-serif",
            animSpeed: 1,
            soundOn: true,
            excludeMode: false
        };

        // 로컬 스토리지 데이터 로드 (없으면 기본 학생 목록 사용)
        let state = {
            participants: JSON.parse(localStorage.getItem('pd_participants')) || [...DEFAULT_STUDENTS],
            history: JSON.parse(localStorage.getItem('pd_history')) || [],
            settings: JSON.parse(localStorage.getItem('pd_settings')) || { ...DEFAULT_SETTINGS }
        };

        const saveState = (key) => {
            if(key === 'participants') localStorage.setItem('pd_participants', JSON.stringify(state.participants));
            if(key === 'history') localStorage.setItem('pd_history', JSON.stringify(state.history));
            if(key === 'settings') localStorage.setItem('pd_settings', JSON.stringify(state.settings));
        };

        // --- 3. 오디오 시스템 ---
        let audioCtx;
        const initAudio = () => {
            if (!state.settings.soundOn) return;
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        };

        const playSound = (type) => {
            if (!state.settings.soundOn || !audioCtx) return;
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, t); osc.frequency.exponentialRampToValueAtTime(300, t + 0.1);
                gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
                osc.start(t); osc.stop(t + 0.1);
            } else if (type === 'tick') {
                osc.type = 'square'; osc.frequency.setValueAtTime(200 + Math.random()*150, t);
                gain.gain.setValueAtTime(0.05, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.05);
                osc.start(t); osc.stop(t + 0.05);
            } else if (type === 'success') {
                const freqs = [523.25, 659.25, 783.99, 1046.50];
                freqs.forEach((freq, i) => {
                    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                    o.type = 'triangle'; o.frequency.setValueAtTime(freq, t + i * 0.1);
                    g.gain.setValueAtTime(0, t + i * 0.1); g.gain.linearRampToValueAtTime(0.3, t + i * 0.1 + 0.05); g.gain.exponentialRampToValueAtTime(0.01, t + i * 0.1 + 2);
                    o.connect(g); g.connect(audioCtx.destination); o.start(t + i * 0.1); o.stop(t + i * 0.1 + 2);
                });
            }
        };

        // --- 4. 공통 UI 유틸리티 ---
        const showToast = (message, type = 'info') => {
            const toast = document.createElement('div');
            let colors = type === 'success' ? 'bg-emerald-500 text-white shadow-emerald-500/30' 
                       : type === 'error' ? 'bg-rose-500 text-white shadow-rose-500/30' 
                       : 'bg-slate-800 text-white dark:bg-white dark:text-slate-800 shadow-slate-800/30';
            let icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-circle-exclamation' : 'fa-info-circle';
            
            toast.className = `toast-enter flex items-center gap-3 px-6 py-4 rounded-2xl shadow-xl font-bold text-sm ${colors}`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i> <span>${message}</span>`;
            dom.toastContainer.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.replace('toast-enter', 'toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        // --- 5. 테마/설정 로직 ---
        const applySettingsToDOM = () => {
            const s = state.settings;
            dom.html.style.setProperty('--theme-primary', s.primaryColor);
            dom.html.style.setProperty('--theme-gradient-start', s.primaryColor);
            
            // 색상을 약간 밝게 변형하여 그라디언트 생성
            const c = s.primaryColor;
            dom.html.style.setProperty('--theme-gradient-end', c);

            if (s.darkMode) dom.html.classList.add('dark');
            else dom.html.classList.remove('dark');

            dom.html.style.setProperty('--font-main', s.font);

            dom.body.classList.remove('pattern-dots', 'pattern-grid', 'pattern-waves', 'none');
            if(s.pattern !== 'none') dom.body.classList.add(s.pattern);

            dom.html.style.setProperty('--anim-speed', s.animSpeed);

            // 폼 동기화
            dom.colorPicker.value = s.primaryColor;
            dom.themeToggle.checked = s.darkMode;
            dom.patternSelect.value = s.pattern;
            dom.fontSelect.value = s.font;
            dom.speedSlider.value = s.animSpeed;
            dom.speedVal.textContent = s.animSpeed + 'x';
            dom.soundToggle.checked = s.soundOn;
            dom.toggleExclude.checked = s.excludeMode;
            
            // 차트 색상 업데이트
            if(chartInstance) renderStatsChart();
        };

        const updateSetting = (key, value) => {
            state.settings[key] = value;
            saveState('settings');
            applySettingsToDOM();
        };

        // 설정 이벤트 바인딩
        dom.colorPicker.addEventListener('input', (e) => updateSetting('primaryColor', e.target.value));
        dom.colorPresets.forEach(btn => {
            btn.addEventListener('click', (e) => updateSetting('primaryColor', e.target.dataset.color));
        });
        dom.themeToggle.addEventListener('change', (e) => updateSetting('darkMode', e.target.checked));
        dom.patternSelect.addEventListener('change', (e) => updateSetting('pattern', e.target.value));
        dom.fontSelect.addEventListener('change', (e) => updateSetting('font', e.target.value));
        dom.speedSlider.addEventListener('input', (e) => updateSetting('animSpeed', parseFloat(e.target.value)));
        dom.soundToggle.addEventListener('change', (e) => updateSetting('soundOn', e.target.checked));
        dom.toggleExclude.addEventListener('change', (e) => updateSetting('excludeMode', e.target.checked));
        
        dom.resetSettings.addEventListener('click', () => {
            if(confirm('설정을 기본값으로 되돌리시겠습니까?')){
                state.settings = { ...DEFAULT_SETTINGS };
                saveState('settings');
                applySettingsToDOM();
                showToast('기본 설정으로 복구되었습니다.');
            }
        });

        // --- 6. 메인 앱 로직 (참가자 관리) ---
        let sortableInstance = null;

        const renderParticipants = () => {
            dom.list.innerHTML = '';
            dom.countBadge.textContent = state.participants.length;
            
            if (state.participants.length === 0) {
                dom.emptyState.style.display = 'flex';
                dom.drawBtn.disabled = true;
            } else {
                dom.emptyState.style.display = 'none';
                dom.drawBtn.disabled = state.participants.length < 2;
            }

            state.participants.forEach((name, idx) => {
                const li = document.createElement('li');
                li.className = 'flex justify-between items-center bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-3.5 rounded-xl shadow-sm hover:shadow-md transition-shadow group cursor-move';
                li.dataset.id = name;
                li.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <i class="fa-solid fa-grip-vertical text-slate-300 dark:text-slate-600 group-hover:text-theme transition-colors"></i>
                        <div class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center shrink-0 text-theme font-bold text-sm">${idx + 1}</div>
                        <span class="font-bold text-slate-700 dark:text-slate-200 truncate">${name}</span>
                    </div>
                    <button onclick="removeParticipant('${name}')" class="text-slate-300 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-500/10 w-9 h-9 rounded-full flex items-center justify-center transition-colors shrink-0" title="삭제">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                `;
                dom.list.appendChild(li);
            });

            // Drag & Drop 초기화
            if(sortableInstance) sortableInstance.destroy();
            sortableInstance = new Sortable(dom.list, {
                animation: 150,
                ghostClass: 'sortable-ghost',
                onEnd: (evt) => {
                    const movedItem = state.participants.splice(evt.oldIndex, 1)[0];
                    state.participants.splice(evt.newIndex, 0, movedItem);
                    saveState('participants');
                    renderParticipants(); 
                }
            });
        };

        dom.form.addEventListener('submit', (e) => {
            e.preventDefault();
            initAudio();
            const name = dom.input.value.trim();
            if (!name) return;
            if (state.participants.includes(name)) {
                showToast('이미 명단에 있는 이름입니다.', 'error');
                return;
            }
            state.participants.push(name);
            saveState('participants');
            dom.input.value = '';
            renderParticipants();
            playSound('click');
        });

        window.removeParticipant = (name) => {
            initAudio();
            state.participants = state.participants.filter(p => p !== name);
            saveState('participants');
            renderParticipants();
            playSound('click');
        };

        dom.resetListBtn.addEventListener('click', () => {
            if(confirm('현재 명단을 초기화하고 기본 학생 명단으로 되돌리시겠습니까?')) {
                state.participants = [...DEFAULT_STUDENTS];
                saveState('participants');
                renderParticipants();
                showToast('기본 명단으로 초기화되었습니다.', 'success');
            }
        });

        // --- 7. 뽑기 로직 (애니메이션 포함) ---
        let isDrawing = false;

        dom.drawBtn.addEventListener('click', () => {
            if (state.participants.length < 2 || isDrawing) return;
            initAudio();
            isDrawing = true;

            // UI 셋업
            dom.resultTitle.style.display = 'none';
            dom.closeModal.style.display = 'none';
            dom.resultOverlay.classList.remove('hidden');
            setTimeout(() => dom.resultOverlay.classList.remove('opacity-0'), 10);

            dom.resultName.className = 'text-6xl md:text-8xl lg:text-[8rem] font-bold text-white/80 rolling-control blur-[2px] transition-all';
            
            const speedMultiplier = state.settings.animSpeed;
            const rollDuration = 3000 / speedMultiplier;
            const rollInterval = 60 / speedMultiplier;
            let currentIdx = -1;

            const rollingTimer = setInterval(() => {
                let nextIdx;
                do { nextIdx = Math.floor(Math.random() * state.participants.length); } 
                while (nextIdx === currentIdx && state.participants.length > 1);
                currentIdx = nextIdx;
                dom.resultName.textContent = state.participants[currentIdx];
                playSound('tick');
            }, rollInterval);

            setTimeout(() => {
                clearInterval(rollingTimer);
                
                const winnerIdx = Math.floor(Math.random() * state.participants.length);
                const finalWinner = state.participants[winnerIdx];
                
                // 기록 저장 및 통계 업데이트
                state.history.unshift({ id: Date.now(), name: finalWinner, date: new Date().toLocaleString() });
                saveState('history');
                renderStatsChart();
                renderHistoryList();

                // 최종 결과 노출 디자인
                dom.resultName.textContent = finalWinner;
                dom.resultName.className = 'text-8xl md:text-[10rem] lg:text-[12rem] font-black text-white drop-shadow-[0_0_60px_var(--theme-primary)] blur-0 transition-all duration-300 transform scale-110';
                
                dom.resultTitle.style.display = 'inline-block';
                dom.closeModal.style.display = 'flex';

                playSound('success');
                fireConfetti();
                
                // 제외 모드
                if (state.settings.excludeMode) {
                    state.participants.splice(winnerIdx, 1);
                    saveState('participants');
                    renderParticipants();
                    setTimeout(() => showToast(`'${finalWinner}' 님이 다음 뽑기에서 제외되었습니다.`), 1000);
                }

            }, rollDuration);
        });

        dom.closeModal.addEventListener('click', () => {
            playSound('click');
            dom.resultOverlay.classList.add('opacity-0');
            clearConfetti();
            setTimeout(() => {
                dom.resultOverlay.classList.add('hidden');
                isDrawing = false;
            }, 500);
        });

        // --- 8. 통계 & 히스토리 (상시 표시) ---
        dom.btnClearHistory.addEventListener('click', () => {
            if(confirm('모든 당첨 기록을 삭제하시겠습니까? 복구할 수 없습니다.')) {
                state.history = [];
                saveState('history');
                renderHistoryList();
                renderStatsChart();
                showToast('기록이 삭제되었습니다.');
            }
        });

        const renderStatsChart = () => {
            const ctxChart = document.getElementById('statsChart').getContext('2d');
            const counts = {};
            state.history.forEach(h => counts[h.name] = (counts[h.name] || 0) + 1);
            
            const sortedData = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 5);
            const labels = sortedData.map(d => d[0]);
            const data = sortedData.map(d => d[1]);

            if (chartInstance) chartInstance.destroy();

            if (labels.length === 0) {
                chartInstance = new Chart(ctxChart, {
                    type: 'bar',
                    data: { labels: ['데이터 없음'], datasets: [{ data: [0], backgroundColor: '#cbd5e1' }] },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { display: false } } }
                });
                return;
            }

            const isDark = document.documentElement.classList.contains('dark');
            const textColor = isDark ? '#94a3b8' : '#64748b';

            chartInstance = new Chart(ctxChart, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '당첨 횟수',
                        data: data,
                        backgroundColor: state.settings.primaryColor,
                        borderRadius: 4,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { padding: 10 } },
                    scales: {
                        y: { beginAtZero: true, ticks: { stepSize: 1, color: textColor }, grid: { color: isDark ? '#334155' : '#f1f5f9' } },
                        x: { ticks: { color: textColor }, grid: { display: false } }
                    }
                }
            });
        };

        const renderHistoryList = () => {
            dom.historyList.innerHTML = '';
            if(state.history.length === 0) {
                dom.historyList.innerHTML = `<li class="text-center text-slate-400 py-10 text-sm">기록이 없습니다.</li>`;
                return;
            }

            // 상위 30개만 렌더링 (퍼포먼스 고려)
            state.history.slice(0, 30).forEach(record => {
                const li = document.createElement('li');
                li.className = 'flex justify-between items-center bg-white dark:bg-slate-800 p-3 border border-slate-100 dark:border-slate-700 rounded-xl shadow-sm';
                li.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-theme/10 text-theme flex items-center justify-center shrink-0"><i class="fa-solid fa-trophy"></i></div>
                        <div>
                            <p class="font-bold text-slate-700 dark:text-slate-200 text-base">${record.name}</p>
                            <p class="text-xs text-slate-400">${record.date}</p>
                        </div>
                    </div>
                `;
                dom.historyList.appendChild(li);
            });
        };

        // --- 9. 폭죽 (Confetti) 효과 ---
        let particles = [];
        let animationId;

        const resizeCanvas = () => {
            dom.confettiCanvas.width = window.innerWidth;
            dom.confettiCanvas.height = window.innerHeight;
        };
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const fireConfetti = () => {
            particles = [];
            const colors = ['#fde047', '#3b82f6', state.settings.primaryColor, '#ec4899', '#10b981', '#ffffff'];
            
            for (let i = 0; i < 300; i++) {
                particles.push({
                    x: dom.confettiCanvas.width / 2, 
                    y: dom.confettiCanvas.height / 2,
                    r: Math.random() * 6 + 4,
                    dx: Math.random() * 40 - 20,
                    dy: Math.random() * -30 - 10,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.floor(Math.random() * 10) - 10,
                    tiltAngleInc: (Math.random() * 0.07) + 0.05,
                    tiltAngle: 0,
                    shape: Math.random() > 0.5 ? 'circle' : 'rect'
                });
            }
            animateConfetti();
        };

        const animateConfetti = () => {
            ctx.clearRect(0, 0, dom.confettiCanvas.width, dom.confettiCanvas.height);
            let activeParticles = 0;

            particles.forEach((p) => {
                p.tiltAngle += p.tiltAngleInc;
                p.y += (Math.cos(p.tiltAngle) + 1 + p.r / 2) / 2;
                p.x += Math.sin(p.tiltAngle) * 2 + p.dx; 
                p.dy += 0.5; 
                p.y += p.dy; 

                if (p.y <= dom.confettiCanvas.height) activeParticles++;

                ctx.beginPath();
                ctx.lineWidth = p.r;
                ctx.strokeStyle = p.color;
                ctx.fillStyle = p.color;

                if(p.shape === 'circle') {
                    ctx.arc(p.x, p.y, p.r/2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.moveTo(p.x + p.tilt + p.r, p.y);
                    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
                    ctx.stroke();
                }
            });

            if (activeParticles > 0) animationId = requestAnimationFrame(animateConfetti);
        };

        const clearConfetti = () => {
            particles = [];
            ctx.clearRect(0, 0, dom.confettiCanvas.width, dom.confettiCanvas.height);
            if (animationId) cancelAnimationFrame(animationId);
        };

        // --- 10. 앱 초기화 ---
        applySettingsToDOM();
        renderParticipants();
        renderStatsChart();
        renderHistoryList();

    </script>
</body>
</html>
